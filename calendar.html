<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
     <link rel="shortcut icon" href="favicon.ico">
    <style>
/* ===== RESET ===== */
*{margin:0;padding:0;box-sizing:border-box}

/* ===== BODY ===== */
body{
    font-family:'Segoe UI','Poppins',system-ui;
    background:#000;
    min-height:100vh;
    position:relative;
    color:#fff;
}

/* nền giống index */
body::before{
    content:'';
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 70% 20%, rgba(255,100,0,0.15), transparent 40%),
        radial-gradient(circle at 20% 80%, rgba(255,120,0,0.12), transparent 50%),
        linear-gradient(135deg,#000 0%,#0a0500 60%,#140800 100%);
    z-index:-2;
}
body::after{
    content:'';
    position:fixed;
    inset:0;
    background-image:
        radial-gradient(1px 1px at 20% 30%, rgba(255,150,80,.4), transparent),
        radial-gradient(1px 1px at 80% 70%, rgba(255,120,50,.4), transparent);
    z-index:-1;
}

/* ===== BACK ===== */
.back-home{
    position:fixed;
    top:20px;
    left:20px;
    background:rgba(0,0,0,.6);
    border:1px solid rgba(255,120,40,.3);
    padding:8px 16px;
    border-radius:30px;
    color:#ffaa66;
    text-decoration:none;
    z-index:1000;
}
.back-home:hover{
    background:#ff6600;
    color:#000;
}

/* ===== CONTAINER ===== */
.container{
    max-width:1400px;
    margin:auto;
    padding:30px 20px;
}

/* ===== CARD ===== */
.app-header,
.controls-panel,
.tags-manager,
.calendar-container{
    background:rgba(0, 0, 0, 0.85);
    backdrop-filter:blur(12px);
    border-radius:24px;
    border:1px solid rgba(255,120,40,.25);
    padding:20px;
    margin-bottom:20px;
}

/* ===== HEADER ===== */
.app-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
}

.app-title{
    font-size:1.8rem;
    font-weight:bold;
    color:#ffb066;
}

.app-subtitle{
    font-size:.9rem;
    color:#ffaa77;
}

/* ===== SEARCH ===== */
.search-container{
    position:relative;
}
#global-search{
    padding:10px 16px;
    border-radius:30px;
    border:1px solid #ff6600;
    background:#111;
    color:#fff;
    outline:none;
    transition:all 0.3s ease;
}
#global-search:focus{
    border-color:#ffaa44;
    box-shadow:0 0 0 2px rgba(255,102,0,0.3);
}

/* ===== CONTROLS ===== */
.controls-panel{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
}

.view-btn,
.nav-btn{
    padding:8px 16px;
    border-radius:30px;
    border:1px solid #ff6600;
    background:transparent;
    color:#ffaa66;
    cursor:pointer;
}
.view-btn.active,
.view-btn:hover,
.nav-btn:hover{
    background:#ff6600;
    color:#000;
}

.month-navigation{
    display:flex;
    gap:10px;
    align-items:center;
}

#current-month-year{
    color:#ffb066;
    font-weight:600;
}

/* ===== TAG ===== */
.tags-container{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:15px;
}

.tag-item{
    padding:5px 12px;
    border-radius:20px;
    font-size:.8rem;
    color: #000000;
    display:flex;
    align-items:center;
    gap:6px;
}

.delete-tag-btn{
    border:none;
    background:rgba(0,0,0,.5);
    color:#fff;
    border-radius:50%;
    width:18px;
    height:18px;
    cursor:pointer;
}

.add-tag-form{
    display:flex;
    gap:10px;
    margin-top:10px;
}
#new-tag-name{
    flex:1;
    padding:8px 12px;
    background:#111;
    border:1px solid #ff6600;
    border-radius:30px;
    color:#fff;
}
#new-tag-color{
    width:50px;
    border:1px solid #ff6600;
    border-radius:30px;
    background:#111;
    cursor:pointer;
}
#add-tag-btn{
    padding:8px 20px;
    background:#ff6600;
    border:none;
    border-radius:30px;
    color:#000;
    font-weight:bold;
    cursor:pointer;
}

/* ===== CALENDAR ===== */
.month-view, .year-view{display:none;}
.month-view.active, .year-view.active{display:block;}

.month-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:8px;
}

.day-header{
    text-align:center;
    color:#ffaa66;
    padding:8px;
    font-weight:bold;
}

.day-cell{
    background:rgba(0,0,0,.6);
    border:1px solid rgba(255,120,40,.2);
    border-radius:14px;
    padding:10px;
    min-height:100px;
    cursor:pointer;
    transition:.2s;
}
.day-cell:hover{
    background:rgba(255,102,0,.15);
}
.day-cell.today{
    border:2px solid #ff6600;
    background:rgba(255,102,0,.25);
}
.day-cell.other-month{
    opacity:0.5;
}
.day-number{
    font-weight:bold;
    color:#ffaa66;
    font-size:1.1rem;
    margin-bottom:5px;
}
.day-tags{
    display:flex;
    flex-wrap:wrap;
    gap:4px;
    margin-bottom:5px;
}
.day-tag{
    font-size:0.65rem;
    padding:2px 6px;
    border-radius:12px;
    color:#000000;
}
.note-title{
    font-size:.7rem;
    color:#ffcc99;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}
.search-highlight{
    background:#ff8844;
    color:#000;
    padding:0 2px;
    border-radius:3px;
    font-weight:bold;
}

/* Highlight kết quả tìm kiếm */
.day-cell.search-match {
    box-shadow: 0 0 0 2px #ff8844;
    background: rgba(255,136,68,0.3);
    animation: pulse 0.5s ease;
}

.year-day.search-match {
    background: #ff8844;
    color: #000;
    font-weight: bold;
    box-shadow: 0 0 0 1px #ff8844;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.02); }
    100% { transform: scale(1); }
}

/* ===== YEAR ===== */
.year-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}
.year-month{
    border:1px solid rgba(255,120,40,.2);
    border-radius:16px;
    overflow:hidden;
    cursor:pointer;
}
.year-month:hover{
    border-color:#ff6600;
}
.year-month-header{
    background:#000000;
    color:#ffaa66;
    text-align:center;
    border-bottom: 2px solid rgba(255, 102, 0, 0.6);
    padding:8px;
    padding-top:15px;
    font-weight:bold;
}
.year-month-days{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:2px;
    padding:8px;
    background:rgba(0,0,0,0.3);
   
}
.year-day{
    text-align:center;
    
    padding:4px;
    padding-top: 6px;
    padding-bottom: 6px;
    font-size:.7rem;
    cursor:pointer;

    border-radius:6px;
}
.year-day:hover{
    background:rgba(255,102,0,0.3);
}
.year-day.today{
    background:#ff6600;
    color:#000;
    font-weight:bold;
}


/* ===== MODAL ===== */
.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.8);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:2000;
}
.modal.active{display:flex;}

.modal-content{
    background:#000;
    border:1px solid #ff6600;
    border-radius:20px;
    padding:20px;
    width:90%;
    max-width:400px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}
.modal-title{
    font-size:1.2rem;
    font-weight:bold;
    color:#ffaa66;
}
.close-modal{
    border:none;
    background:none;
    color:#fff;
    font-size:24px;
    cursor:pointer;
}

.selected-date{
    text-align:center;
    color:#ffaa66;
    margin-bottom:15px;
    padding-bottom:10px;
    border-bottom:1px solid #ff6600;
}

input,textarea{
    width:100%;
    margin-top:10px;
    padding:10px;
    background:#111;
    border:1px solid #ff6600;
    color:#fff;
    border-radius:10px;
    outline:none;
}
textarea{
    height:100px;
    resize:vertical;
}

.tags-selection{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:15px;
}
.tag-option{
    padding:5px 12px;
    border-radius:20px;
    font-size:0.75rem;
    cursor:pointer;
    transition:0.2s;
    color:#fff;
}
.tag-option.selected{
    border:2px solid white;
    transform:scale(1.02);
}

.modal-actions{
    margin-top:20px;
    display:flex;
    gap:10px;
    justify-content:flex-end;
}
.modal-btn{
    padding:8px 16px;
    border-radius:20px;
    border:none;
    font-weight:bold;
    cursor:pointer;
}
.save-btn{background:#ff6600;color:#000;}
.cancel-btn{background:#333;color:#fff;}
.delete-btn{background:#cc3333;color:#fff;}

@media (max-width:1000px){
    .year-grid{grid-template-columns:repeat(3,1fr);}
}
@media (max-width:768px){
    .year-grid{grid-template-columns:repeat(2,1fr);}
    .app-header{flex-direction:column;text-align:center;}
    .controls-panel{flex-direction:column;}
}
@media (max-width:500px){
    .year-grid{grid-template-columns:1fr;}
}
</style>
</head>

<body>

<a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> Quay lại</a>

<div class="container">

<header class="app-header">
    <div>
        <div class="app-title"><i class="fas fa-calendar-alt"></i> Calendar</div>
     
    </div>

    <div class="search-container">
        <input type="text" id="global-search" placeholder="Tìm kiếm ghi chú...">
    </div>
</header>

<div class="controls-panel">
    <div>
        <button class="view-btn active" id="month-view-btn"><i class="fas fa-calendar-alt"></i> Tháng</button>
        <button class="view-btn" id="year-view-btn"><i class="fas fa-calendar-alt"></i> Năm</button>
    </div>

    <div class="month-navigation">
        <button class="nav-btn" id="prev-month">‹</button>
        <div id="current-month-year"></div>
        <button class="nav-btn" id="next-month">›</button>
        <button class="nav-btn" id="prev-year">«</button>
        <button class="nav-btn" id="next-year">»</button>
    </div>
</div>

<div class="tags-manager">
    <h3 style="color: #ffb066;"><i class="fas fa-tags"></i> Quản lý Tag</h3><br>
    <div id="tags-container" class="tags-container"></div>

    <div class="add-tag-form">
        <input id="new-tag-name" placeholder="Tên tag mới...">
        <input type="color" id="new-tag-color" value="#ff6600">
        <button id="add-tag-btn">Thêm</button>
    </div>
</div>

<div class="calendar-container">
    <div id="month-view" class="month-view active">
        <div id="month-grid" class="month-grid"></div>
    </div>

    <div id="year-view" class="year-view">
        <div id="year-grid" class="year-grid"></div>
    </div>
</div>

</div>

<!-- MODAL -->
<div class="modal" id="note-modal">
<div class="modal-content">

<div class="modal-header">
    <div class="modal-title"><i class="fas fa-pen"></i> Ghi chú</div>
    <button class="close-modal" id="close-modal">×</button>
</div>

<div id="selected-date" class="selected-date"></div>

<input id="note-title" placeholder="Tiêu đề...">
<textarea id="note-content" placeholder="Nội dung..."></textarea>

<div id="tags-selection" class="tags-selection"></div>

<div class="modal-actions">
    <button class="modal-btn delete-btn" id="delete-note">Xóa</button>
    <button class="modal-btn cancel-btn" id="cancel-note">Hủy</button>
    <button class="modal-btn save-btn" id="save-note">Lưu</button>
</div>

</div>
</div>

<script>
let appData = {
    currentYear: new Date().getFullYear(),
    currentMonth: new Date().getMonth(),
    notes: JSON.parse(localStorage.getItem('calendarNotes')) || {},
    tags: JSON.parse(localStorage.getItem('calendarTags')) || {
       
    },
    selectedDate: null,
    searchQuery: '',
    viewMode: 'month'
};

const monthNames = ["Tháng 1","Tháng 2","Tháng 3","Tháng 4","Tháng 5","Tháng 6","Tháng 7","Tháng 8","Tháng 9","Tháng 10","Tháng 11","Tháng 12"];
const dayNames = ["CN","T2","T3","T4","T5","T6","T7"];

function updateMonthYearDisplay() {
    document.getElementById('current-month-year').textContent = `${monthNames[appData.currentMonth]}, ${appData.currentYear}`;
}

function formatDateKey(date) {
    return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
}

function parseDateKey(key) {
    let [y,m,d] = key.split('-').map(Number);
    return new Date(y,m-1,d);
}

function getFirstTagColor(dateKey) {
    let note = appData.notes[dateKey];
    if (note && note.tags && note.tags.length > 0 && appData.tags[note.tags[0]]) {
        return appData.tags[note.tags[0]].color;
    }
    return null;
}

function highlightText(text, query) {
    if (!query || !text) return text;
    try {
        const regex = new RegExp(`(${escapeRegExp(query)})`, 'gi');
        return text.replace(regex, '<span class="search-highlight">$1</span>');
    } catch(e) { return text; }
}

function escapeRegExp(string) {
    return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function noteMatchesSearch(note, query) {
    if (!query) return false;
    const title = (note.title || '').toLowerCase();
    const content = (note.content || '').toLowerCase();
    const tags = (note.tags || []).join(' ').toLowerCase();
    return title.includes(query) || content.includes(query) || tags.includes(query);
}

function updateTagCounts() {
    Object.keys(appData.tags).forEach(t => appData.tags[t].count = 0);
    Object.values(appData.notes).forEach(n => {
        if (n.tags) n.tags.forEach(t => {
            if (appData.tags[t]) appData.tags[t].count++;
        });
    });
}

function renderTags() {
    const container = document.getElementById('tags-container');
    container.innerHTML = '';
    Object.entries(appData.tags).forEach(([name, data]) => {
        const tag = document.createElement('div');
        tag.className = 'tag-item';
        tag.style.backgroundColor = data.color;
        tag.innerHTML = `${name} <span class="tag-count">${data.count}</span>
        <button class="delete-tag-btn" data-tag="${name}">×</button>`;
        container.appendChild(tag);
    });
    
    document.querySelectorAll('.delete-tag-btn').forEach(btn => {
        btn.onclick = (e) => {
            e.stopPropagation();
            let tagName = btn.dataset.tag;
            if (confirm(`Xóa tag "${tagName}"?`)) {
                delete appData.tags[tagName];
                Object.values(appData.notes).forEach(n => {
                    if (n.tags) n.tags = n.tags.filter(t => t !== tagName);
                });
                updateTagCounts();
                localStorage.setItem('calendarNotes', JSON.stringify(appData.notes));
                localStorage.setItem('calendarTags', JSON.stringify(appData.tags));
                renderTags();
                renderMonthView();
                renderYearView();
            }
        };
    });
}

function renderMonthView() {
    const grid = document.getElementById('month-grid');
    grid.innerHTML = '';

    dayNames.forEach(d => {
        let h = document.createElement('div');
        h.className = 'day-header';
        h.textContent = d;
        grid.appendChild(h);
    });

    let firstDay = new Date(appData.currentYear, appData.currentMonth, 1);
    let lastDay = new Date(appData.currentYear, appData.currentMonth + 1, 0);
    let startOffset = firstDay.getDay();

    for (let i = 0; i < startOffset; i++) {
        let empty = document.createElement('div');
        empty.className = 'day-cell other-month';
        grid.appendChild(empty);
    }

    for (let d = 1; d <= lastDay.getDate(); d++) {
        let date = new Date(appData.currentYear, appData.currentMonth, d);
        let key = formatDateKey(date);
        let note = appData.notes[key];
        let firstTagColor = getFirstTagColor(key);

        let cell = document.createElement('div');
        cell.className = 'day-cell';
        
        if (date.getDay() === 0 || date.getDay() === 6) cell.classList.add('weekend');
        if (new Date().toDateString() === date.toDateString()) cell.classList.add('today');
        
        let isSearchMatch = false;
        if (appData.searchQuery && note && noteMatchesSearch(note, appData.searchQuery)) {
            cell.classList.add('search-match');
            isSearchMatch = true;
        }
        
        if (firstTagColor) {
            cell.style.borderBottom = `3px solid ${firstTagColor}`;
        }
        
        cell.innerHTML = `<div class="day-number">${d}</div>`;
        
        if (note && note.tags && note.tags.length) {
            let tagDiv = document.createElement('div');
            tagDiv.className = 'day-tags';
            note.tags.slice(0, 2).forEach(t => {
                let span = document.createElement('span');
                span.className = 'day-tag';
                span.textContent = t;
                span.style.backgroundColor = appData.tags[t]?.color || '#666';
                tagDiv.appendChild(span);
            });
            cell.appendChild(tagDiv);
        }
        
        if (note && note.title) {
            let titleDiv = document.createElement('div');
            titleDiv.className = 'note-title';
            let displayTitle = note.title.length > 25 ? note.title.slice(0, 25) + '...' : note.title;
            if (isSearchMatch && appData.searchQuery) {
                titleDiv.innerHTML = highlightText(displayTitle, appData.searchQuery);
            } else {
                titleDiv.textContent = displayTitle;
            }
            cell.appendChild(titleDiv);
        }
        
        cell.onclick = () => openNoteModal(key);
        grid.appendChild(cell);
    }
}

function renderYearView() {
    const grid = document.getElementById('year-grid');
    grid.innerHTML = '';
    
    for (let m = 0; m < 12; m++) {
        let monthDiv = document.createElement('div');
        monthDiv.className = 'year-month';
        monthDiv.onclick = () => {
            appData.currentMonth = m;
            appData.viewMode = 'month';
            switchViewMode('month');
            renderMonthView();
            updateMonthYearDisplay();
        };
        
        let header = document.createElement('div');
        header.className = 'year-month-header';
        header.textContent = monthNames[m];
        monthDiv.appendChild(header);
        
        let daysGrid = document.createElement('div');
        daysGrid.className = 'year-month-days';
        
        dayNames.forEach(day => {
            let d = document.createElement('div');
            d.className = 'day-header';
            d.style.fontSize = '0.7rem';
            d.style.padding = '4px';
            d.textContent = day;
            daysGrid.appendChild(d);
        });
        
        let first = new Date(appData.currentYear, m, 1);
        let last = new Date(appData.currentYear, m + 1, 0);
        let start = first.getDay();
        
        for (let i = 0; i < start; i++) {
            let empty = document.createElement('div');
            empty.className = 'year-day';
            empty.style.visibility = 'hidden';
            daysGrid.appendChild(empty);
        }
        
        for (let d = 1; d <= last.getDate(); d++) {
            let date = new Date(appData.currentYear, m, d);
            let key = formatDateKey(date);
            let dayDiv = document.createElement('div');
            dayDiv.className = 'year-day';
            
            if (date.getDay() === 0 || date.getDay() === 6) dayDiv.classList.add('weekend');
            if (new Date().toDateString() === date.toDateString()) dayDiv.classList.add('today');
            dayDiv.textContent = d;
            
            let firstTagColor = getFirstTagColor(key);
            if (firstTagColor) {
                dayDiv.style.borderBottom = `3px solid ${firstTagColor}`;
            }
            
            let note = appData.notes[key];
            if (appData.searchQuery && note && noteMatchesSearch(note, appData.searchQuery)) {
                dayDiv.classList.add('search-match');
            }
            if (note) dayDiv.classList.add('has-note');
            
            dayDiv.onclick = (e) => {
                e.stopPropagation();
                openNoteModal(key);
            };
            daysGrid.appendChild(dayDiv);
        }
        
        monthDiv.appendChild(daysGrid);
        grid.appendChild(monthDiv);
    }
}

function openNoteModal(dateKey) {
    appData.selectedDate = dateKey;
    let date = parseDateKey(dateKey);
    document.getElementById('selected-date').textContent = `${date.getDate()} ${monthNames[date.getMonth()]}, ${date.getFullYear()}`;
    
    let note = appData.notes[dateKey] || { title: '', content: '', tags: [] };
    document.getElementById('note-title').value = note.title;
    document.getElementById('note-content').value = note.content;
    
    let tagsDiv = document.getElementById('tags-selection');
    tagsDiv.innerHTML = '';
    Object.entries(appData.tags).forEach(([name, data]) => {
        let opt = document.createElement('div');
        opt.className = `tag-option ${note.tags?.includes(name) ? 'selected' : ''}`;
        opt.textContent = name;
        opt.style.backgroundColor = data.color;
        opt.onclick = () => opt.classList.toggle('selected');
        tagsDiv.appendChild(opt);
    });
    
    document.getElementById('note-modal').classList.add('active');
}

function closeNoteModal() {
    document.getElementById('note-modal').classList.remove('active');
    appData.selectedDate = null;
}

function saveNote() {
    if (!appData.selectedDate) return;
    let title = document.getElementById('note-title').value.trim();
    let content = document.getElementById('note-content').value.trim();
    let selectedTags = Array.from(document.querySelectorAll('#tags-selection .tag-option.selected')).map(el => el.textContent);
    
    if (!title && !content && selectedTags.length === 0) {
        delete appData.notes[appData.selectedDate];
    } else {
        appData.notes[appData.selectedDate] = { title, content, tags: selectedTags, lastModified: new Date().toISOString() };
    }
    
    updateTagCounts();
    localStorage.setItem('calendarNotes', JSON.stringify(appData.notes));
    localStorage.setItem('calendarTags', JSON.stringify(appData.tags));
    renderMonthView();
    renderYearView();
    renderTags();
    closeNoteModal();
}

function deleteNote() {
    if (appData.selectedDate && confirm('Xóa ghi chú này?')) {
        delete appData.notes[appData.selectedDate];
        updateTagCounts();
        localStorage.setItem('calendarNotes', JSON.stringify(appData.notes));
        localStorage.setItem('calendarTags', JSON.stringify(appData.tags));
        renderMonthView();
        renderYearView();
        renderTags();
        closeNoteModal();
    }
}

function addNewTag() {
    let name = document.getElementById('new-tag-name').value.trim();
    let color = document.getElementById('new-tag-color').value;
    if (!name) return;
    if (appData.tags[name]) { alert('Tag đã tồn tại'); return; }
    appData.tags[name] = { color, count: 0 };
    localStorage.setItem('calendarTags', JSON.stringify(appData.tags));
    renderTags();
    document.getElementById('new-tag-name').value = '';
}

function switchViewMode(mode) {
    appData.viewMode = mode;
    document.getElementById('month-view').classList.toggle('active', mode === 'month');
    document.getElementById('year-view').classList.toggle('active', mode === 'year');
    document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('active'));
    if (mode === 'month') document.getElementById('month-view-btn').classList.add('active');
    else document.getElementById('year-view-btn').classList.add('active');
}

function changeMonth(delta) {
    let newDate = new Date(appData.currentYear, appData.currentMonth + delta, 1);
    appData.currentYear = newDate.getFullYear();
    appData.currentMonth = newDate.getMonth();
    updateMonthYearDisplay();
    renderMonthView();
}

function changeYear(delta) {
    appData.currentYear += delta;
    updateMonthYearDisplay();
    renderMonthView();
    renderYearView();
}

function performSearch() {
    let query = document.getElementById('global-search').value.toLowerCase().trim();
    appData.searchQuery = query;
    renderMonthView();
    renderYearView();
    
    // Hiển thị thông báo kết quả tìm kiếm
    let resultCount = 0;
    Object.values(appData.notes).forEach(note => {
        if (noteMatchesSearch(note, query)) resultCount++;
    });
    
    const statusDiv = document.querySelector('.tags-manager h3');
    if (query && resultCount === 0) {
        const msg = document.createElement('div');
        msg.style.cssText = 'color:#ffaa66; margin-top:10px; font-size:0.8rem;';
        msg.id = 'search-status';
        msg.innerHTML = `<i class="fas fa-search"></i> Không tìm thấy "${query}"`;
        if (!document.getElementById('search-status')) {
            document.querySelector('.tags-manager').appendChild(msg);
            setTimeout(() => msg.remove(), 3000);
        }
    } else if (query && resultCount > 0) {
        const msg = document.createElement('div');
        msg.style.cssText = 'color:#ffaa66; margin-top:10px; font-size:0.8rem;';
        msg.id = 'search-status';
        msg.innerHTML = `<i class="fas fa-check-circle"></i> Tìm thấy ${resultCount} ghi chú`;
        if (!document.getElementById('search-status')) {
            document.querySelector('.tags-manager').appendChild(msg);
            setTimeout(() => msg.remove(), 2000);
        }
    }
}

document.getElementById('month-view-btn').onclick = () => switchViewMode('month');
document.getElementById('year-view-btn').onclick = () => switchViewMode('year');
document.getElementById('prev-month').onclick = () => changeMonth(-1);
document.getElementById('next-month').onclick = () => changeMonth(1);
document.getElementById('prev-year').onclick = () => changeYear(-1);
document.getElementById('next-year').onclick = () => changeYear(1);
document.getElementById('add-tag-btn').onclick = addNewTag;
document.getElementById('global-search').oninput = performSearch;
document.getElementById('close-modal').onclick = closeNoteModal;
document.getElementById('cancel-note').onclick = closeNoteModal;
document.getElementById('save-note').onclick = saveNote;
document.getElementById('delete-note').onclick = deleteNote;

updateTagCounts();
renderTags();
renderMonthView();
renderYearView();
updateMonthYearDisplay();
</script>

</body>
</html>
