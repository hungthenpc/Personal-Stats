<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Stats - Personal Music Analytics</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1DB954 0%, #191414 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Card */
        .card {
            background: white;
            border-radius: 24px;
            padding: 28px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.15);
        }

        /* Header */
        h1 {
            color: #1DB954;
            font-size: 32px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h2 {
            color: #333;
            font-size: 20px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #f0f0f0;
        }

        h3 {
            color: #666;
            font-size: 14px;
            font-weight: normal;
            margin-bottom: 20px;
        }

        /* Button */
        .btn-spotify {
            background: #1DB954;
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-spotify:hover {
            background: #1ed760;
            transform: scale(1.02);
        }

        .btn-logout {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 20px;
            font-size: 14px;
            border-radius: 20px;
            cursor: pointer;
            float: right;
            transition: all 0.2s;
        }

        .btn-logout:hover {
            background: #c82333;
        }

        /* Track list */
        .track-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .track {
            display: flex;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #eee;
            transition: background 0.2s;
        }

        .track:hover {
            background: #f8f9fa;
        }

        .track-rank {
            font-size: 20px;
            font-weight: bold;
            width: 45px;
            color: #1DB954;
        }

        .track-img {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            margin-right: 15px;
            object-fit: cover;
        }

        .track-info {
            flex: 1;
        }

        .track-name {
            font-weight: 600;
            margin-bottom: 4px;
            color: #333;
        }

        .track-artist {
            font-size: 13px;
            color: #666;
        }

        .track-meta {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }

        /* Stats grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            margin: 10px 0;
        }

        .stat-label {
            font-size: 13px;
            opacity: 0.9;
        }

        /* User info */
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
        }

        .user-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
        }

        .user-name {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .user-email {
            font-size: 13px;
            color: #666;
            margin-top: 4px;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 50px;
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #1DB954;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Error */
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
        }

        /* Clearfix */
        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }

        /* Scrollbar */
        .track-list::-webkit-scrollbar {
            width: 6px;
        }

        .track-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .track-list::-webkit-scrollbar-thumb {
            background: #1DB954;
            border-radius: 10px;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .card {
                padding: 20px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .track-rank {
                width: 35px;
                font-size: 16px;
            }
            
            .track-img {
                width: 40px;
                height: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Card -->
        <div id="loginCard" class="card" style="text-align: center;">
            <h1 style="justify-content: center;">🎵 Spotify Stats</h1>
            <p style="color: #666; margin: 10px 0;">Xem thống kê nghe nhạc Spotify của bạn</p>
            <div style="margin: 20px 0;">
                <p style="color: #999; font-size: 14px;">📊 Top bài hát yêu thích</p>
                <p style="color: #999; font-size: 14px;">🎤 Thống kê nghệ sĩ</p>
                <p style="color: #999; font-size: 14px;">🕐 Lịch sử nghe gần đây</p>
            </div>
            <button class="btn-spotify" onclick="loginToSpotify()">
                🔐 Đăng nhập với Spotify
            </button>
        </div>

        <!-- Dashboard (ẩn ban đầu) -->
        <div id="dashboard" style="display: none;">
            <!-- User Info Card -->
            <div class="card clearfix">
                <div id="userInfo" class="user-info"></div>
                <button class="btn-logout" onclick="logout()">Đăng xuất</button>
            </div>

            <!-- Stats Card -->
            <div class="card">
                <h2>📊 Thống kê nhanh</h2>
                <div id="statsContainer"></div>
            </div>

            <!-- Top Tracks Card -->
            <div class="card">
                <h2>🏆 Top 10 bài hát yêu thích</h2>
                <div id="topTracksContainer" class="track-list"></div>
            </div>

            <!-- Recent Tracks Card -->
            <div class="card">
                <h2>🕐 10 bài hát vừa nghe</h2>
                <div id="recentTracksContainer" class="track-list"></div>
            </div>
        </div>

        <!-- Loading -->
        <div id="loading" class="card loading" style="display: none;">
            <div class="spinner"></div>
            <p>Đang tải dữ liệu từ Spotify...</p>
            <p style="font-size: 13px; color: #999; margin-top: 10px;">Vui lòng chờ trong giây lát</p>
        </div>
    </div>

    <script>
        // ==================== CẤU HÌNH ====================
        const CLIENT_ID = "cd0524eb368f45ceb21721b9543bd5d6";
        const REDIRECT_URI = window.location.origin + window.location.pathname;
        
        // ==================== KHỞI TẠO ====================
        // Kiểm tra code từ URL (sau khi đăng nhập Spotify)
        const urlParams = new URLSearchParams(window.location.search);
        const authCode = urlParams.get('code');
        
        if (authCode) {
            // Có code -> đổi lấy token
            exchangeCodeForToken(authCode);
        } else {
            // Kiểm tra token đã lưu
            const savedToken = localStorage.getItem('spotify_token');
            const tokenExpiry = localStorage.getItem('spotify_token_expiry');
            
            if (savedToken && tokenExpiry && Date.now() < parseInt(tokenExpiry)) {
                loadDashboard(savedToken);
            } else {
                // Hết hạn hoặc chưa có token
                document.getElementById('loginCard').style.display = 'block';
            }
        }
        
        // ==================== HÀM CHÍNH ====================
        
        function loginToSpotify() {
            const scope = 'user-read-recently-played user-top-read user-read-private';
            const authUrl = `https://accounts.spotify.com/authorize?` +
                `client_id=${CLIENT_ID}` +
                `&response_type=code` +
                `&redirect_uri=${encodeURIComponent(REDIRECT_URI)}` +
                `&scope=${encodeURIComponent(scope)}` +
                `&show_dialog=true`;
            
            window.location.href = authUrl;
        }
        
        async function exchangeCodeForToken(code) {
            showLoading(true);
            
            try {
                // Gọi API đổi code lấy token
                const response = await fetch('https://accounts.spotify.com/api/token', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        grant_type: 'authorization_code',
                        code: code,
                        redirect_uri: REDIRECT_URI,
                        client_id: CLIENT_ID,
                        client_secret: '1a9856d20b41437d9c56a29d29e55f53' // Ghi chú: Cần client secret thật!
                    })
                });
                
                const data = await response.json();
                
                if (data.access_token) {
                    // Lưu token
                    localStorage.setItem('spotify_token', data.access_token);
                    localStorage.setItem('spotify_token_expiry', Date.now() + (data.expires_in * 1000));
                    
                    // Xóa code khỏi URL
                    window.history.replaceState({}, document.title, window.location.pathname);
                    
                    // Load dashboard
                    loadDashboard(data.access_token);
                } else {
                    throw new Error(data.error_description || 'Không lấy được token');
                }
            } catch (error) {
                console.error('Lỗi:', error);
                showError('Không thể đăng nhập. Vui lòng thử lại sau.');
                document.getElementById('loginCard').style.display = 'block';
                showLoading(false);
            }
        }
        
        async function loadDashboard(token) {
            showLoading(true);
            
            try {
                // Lấy thông tin user
                const userResponse = await fetch('https://api.spotify.com/v1/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!userResponse.ok) {
                    throw new Error('Token hết hạn');
                }
                
                const userData = await userResponse.json();
                
                // Lấy top tracks
                const topResponse = await fetch('https://api.spotify.com/v1/me/top/tracks?limit=10&time_range=medium_term', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const topData = await topResponse.json();
                
                // Lấy recently played
                const recentResponse = await fetch('https://api.spotify.com/v1/me/player/recently-played?limit=10', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const recentData = await recentResponse.json();
                
                // Hiển thị
                displayUserInfo(userData);
                displayStats(topData, recentData);
                displayTopTracks(topData);
                displayRecentTracks(recentData);
                
                // Ẩn login, hiện dashboard
                document.getElementById('loginCard').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                
            } catch (error) {
                console.error('Lỗi:', error);
                showError('Không thể tải dữ liệu. Vui lòng đăng nhập lại.');
                logout();
            } finally {
                showLoading(false);
            }
        }
        
        // ==================== HIỂN THỊ ====================
        
        function displayUserInfo(user) {
            const userInfoHtml = `
                ${user.images && user.images[0] ? 
                    `<img class="user-avatar" src="${user.images[0].url}" alt="Avatar">` : 
                    `<div style="width: 60px; height: 60px; background: #1DB954; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px;">🎵</div>`
                }
                <div>
                    <div class="user-name">${escapeHtml(user.display_name || user.id)}</div>
                    <div class="user-email">${user.email || ''}</div>
                    <div style="font-size: 12px; color: #1DB954; margin-top: 5px;">✓ Đã kết nối Spotify</div>
                </div>
            `;
            document.getElementById('userInfo').innerHTML = userInfoHtml;
        }
        
        function displayStats(topData, recentData) {
            const topTracks = topData.items || [];
            const recentTracks = recentData.items || [];
            
            // Đếm số bài hát độc nhất
            const uniqueTracks = new Set(topTracks.map(t => t.id)).size;
            
            // Tìm nghệ sĩ yêu thích
            const artistCount = {};
            topTracks.forEach(track => {
                const artist = track.artists[0].name;
                artistCount[artist] = (artistCount[artist] || 0) + 1;
            });
            const topArtist = Object.entries(artistCount).sort((a, b) => b[1] - a[1])[0];
            
            // Tính tổng thời gian nghe gần đây
            let totalDurationMs = 0;
            recentTracks.forEach(item => {
                totalDurationMs += item.track.duration_ms;
            });
            const totalMinutes = Math.floor(totalDurationMs / 60000);
            
            const statsHtml = `
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">🎵 Bài hát yêu thích</div>
                        <div class="stat-number">${topTracks.length}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">⭐ Bài hát độc nhất</div>
                        <div class="stat-number">${uniqueTracks}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">🎤 Nghệ sĩ yêu thích</div>
                        <div class="stat-number" style="font-size: 20px;">${topArtist ? escapeHtml(topArtist[0]) : 'Chưa có'}</div>
                        <div class="stat-label">${topArtist ? topArtist[1] + ' bài' : ''}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">⏱️ Thời gian nghe</div>
                        <div class="stat-number">${totalMinutes}</div>
                        <div class="stat-label">phút (10 bài gần nhất)</div>
                    </div>
                </div>
            `;
            
            document.getElementById('statsContainer').innerHTML = statsHtml;
        }
        
        function displayTopTracks(data) {
            const tracks = data.items || [];
            
            if (tracks.length === 0) {
                document.getElementById('topTracksContainer').innerHTML = '<p style="color: #999; text-align: center;">Chưa có dữ liệu. Hãy nghe nhạc nhiều hơn!</p>';
                return;
            }
            
            let html = '';
            tracks.forEach((track, index) => {
                const albumArt = track.album.images[0]?.url || '';
                html += `
                    <div class="track">
                        <div class="track-rank">#${index + 1}</div>
                        ${albumArt ? `<img class="track-img" src="${albumArt}" alt="${escapeHtml(track.name)}">` : ''}
                        <div class="track-info">
                            <div class="track-name">${escapeHtml(track.name)}</div>
                            <div class="track-artist">${escapeHtml(track.artists[0].name)}</div>
                            <div class="track-meta">🔥 Độ phổ biến: ${track.popularity}/100</div>
                        </div>
                    </div>
                `;
            });
            
            document.getElementById('topTracksContainer').innerHTML = html;
        }
        
        function displayRecentTracks(data) {
            const items = data.items || [];
            
            if (items.length === 0) {
                document.getElementById('recentTracksContainer').innerHTML = '<p style="color: #999; text-align: center;">Chưa có dữ liệu. Hãy nghe nhạc trên Spotify!</p>';
                return;
            }
            
            let html = '';
            items.forEach((item) => {
                const track = item.track;
                const albumArt = track.album.images[0]?.url || '';
                const playedAt = new Date(item.played_at);
                const timeAgo = getTimeAgo(playedAt);
                
                html += `
                    <div class="track">
                        ${albumArt ? `<img class="track-img" src="${albumArt}" alt="${escapeHtml(track.name)}">` : ''}
                        <div class="track-info">
                            <div class="track-name">${escapeHtml(track.name)}</div>
                            <div class="track-artist">${escapeHtml(track.artists[0].name)}</div>
                            <div class="track-meta">🎧 Nghe ${timeAgo}</div>
                        </div>
                    </div>
                `;
            });
            
            document.getElementById('recentTracksContainer').innerHTML = html;
        }
        
        // ==================== UTILITY ====================
        
        function getTimeAgo(date) {
            const seconds = Math.floor((new Date() - date) / 1000);
            
            if (seconds < 60) return 'vừa xong';
            if (seconds < 3600) return `${Math.floor(seconds / 60)} phút trước`;
            if (seconds < 86400) return `${Math.floor(seconds / 3600)} giờ trước`;
            if (seconds < 604800) return `${Math.floor(seconds / 86400)} ngày trước`;
            return `${Math.floor(seconds / 604800)} tuần trước`;
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function logout() {
            localStorage.removeItem('spotify_token');
            localStorage.removeItem('spotify_token_expiry');
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('loginCard').style.display = 'block';
        }
        
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }
        
        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error';
            errorDiv.innerHTML = `❌ ${message}`;
            const container = document.querySelector('.container');
            container.insertBefore(errorDiv, container.firstChild);
            setTimeout(() => errorDiv.remove(), 5000);
        }
    </script>
</body>
</html>
