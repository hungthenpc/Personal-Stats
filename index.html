<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HomePage</title>

<!-- Font Awesome 6 (miễn phí, icon đẹp) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
    min-height: 100vh;
    position: relative;
    background: #000000;
}
.fas, .far, .fab, .fa-brands {
    color: #db8310 !important;
    transition: color 0.3s ease !important;
    padding-top:3px;
}


/* Background gradient chéo: đen -> cam vũ trụ */
body::before {
    content: '';
    position: fixed;
    inset: 0;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 70% 20%, rgba(255,100,0,0.15), transparent 40%),
                radial-gradient(circle at 20% 80%, rgba(255,120,0,0.12), transparent 50%),
                linear-gradient(135deg, #000000 0%, #0a0500 60%, #140800 100%);
    z-index: -2;
}

/* Hiệu ứng sao nền tinh tế */
body::after {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: 
        radial-gradient(1.5px 1.5px at 15% 20%, rgba(255, 180, 100, 0.6), rgba(0,0,0,0)),
        radial-gradient(1px 1px at 75% 45%, rgba(255, 140, 50, 0.5), rgba(0,0,0,0)),
        radial-gradient(2px 2px at 92% 80%, rgba(255, 100, 0, 0.7), rgba(0,0,0,0)),
        radial-gradient(1px 1px at 30% 70%, rgba(255, 120, 30, 0.5), rgba(0,0,0,0)),
        radial-gradient(1.2px 1.2px at 55% 15%, rgba(255, 160, 70, 0.6), rgba(0,0,0,0)),
        radial-gradient(1.8px 1.8px at 85% 92%, rgba(255, 80, 0, 0.8), rgba(0,0,0,0));
    background-repeat: no-repeat;
    background-size: 200px 200px;
    opacity: 0.5;
    pointer-events: none;
    z-index: -1;
}
#spotify-user-info {
    display: none;
}
.container {
    max-width: 1400px;
    margin: auto;
    padding: 40px 20px;
    position: relative;
    z-index: 2;
}

h1 {
    text-align: center;
    font-size: 3rem;
    margin-bottom: 8px;
    background: none;
    background-clip: text;
    -webkit-background-clip: text;
    color:  #ffb066;
    text-shadow: 0 0 20px rgba(255,120,0,0.3);
    letter-spacing: 2px;
}

.subtitle {
    text-align: center;
    color: #ffb066;
    margin-bottom: 40px;
    font-size: 0.9rem;
    letter-spacing: 1px;
    opacity: 0.9;
}

/* Grid 4 card link đầu */
.link-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 25px;
    margin-bottom: 40px;
}

/* Grid 3 card nội dung chính */
.content-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 25px;
    margin-bottom: 40px;
}

/* Grid 2 card cuối */
.bottom-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
    margin-bottom: 40px;
}

.card {
    background: rgba(10, 10, 10, 0.85);
    backdrop-filter: blur(12px);
    border-radius: 24px;
    padding: 24px;
    border: 1px solid rgba(255, 120, 40, 0.25);
    transition: 0.3s;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
}

.card:hover {
    transform: translateY(-6px);
    border-color: #ff7a1a;
    box-shadow: 0 10px 25px rgba(255, 120, 40, 0.25);
    background: rgba(0, 0, 0, 0.8);
}

.card-header {
    font-size: 1.3rem;
    font-weight: 600;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 2px solid rgba(255, 102, 0, 0.6);
    display: flex;
    align-items: center;
    justify-content: space-between;
    letter-spacing: 0.5px;
    color: #ffd9b3;
}

.card-header-left {
    display: flex;
    align-items: center;
    gap: 12px;
}

.card-header-left i {
    font-size: 1.4rem;
    width: 28px;
    text-align: center;
}

.view-more {
    font-size: 0.7rem;
    background: rgba(255, 102, 0, 0.25);
    padding: 5px 12px;
    border-radius: 30px;
    cursor: pointer;
    transition: 0.2s;
    color: #ffaa66;
}

.view-more:hover {
    background: #ff6600;
    color: #000;
}

.track-list {
    list-style: none;
    max-height: 350px;
    overflow-y: auto;
}

.track-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid rgba(255, 102, 0, 0.25);
    transition: 0.2s;
    cursor: pointer;
}

.track-item:hover {
    background: rgba(255, 102, 0, 0.12);
    padding-left: 8px;
    border-radius: 16px;
}

.track-rank {
    font-size: 1rem;
    font-weight: bold;
    color: #ffaa44;
    width: 32px;
}

.track-img {
    width: 50px;
    height: 70px;
    border-radius: 12px;
    object-fit: cover;
    background: #1a0c00;
    border: 1px solid rgba(255, 102, 0, 0.4);
}

.track-info {
    flex: 1;
}

.track-name {
    font-weight: 600;
    margin-bottom: 5px;
    font-size: 0.9rem;
    color: #ffaa66;
}

.track-artist {
    font-size: 0.7rem;
    color: #ffb066;
}

.track-meta {
    font-size: 0.7rem;
    color: #ffb066;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 4px;
}

/* Lịch */
.calendar-week {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-bottom: 20px;
}

.calendar-day-header {
    text-align: center;
    font-size: 0.7rem;
    color: #ffaa66;
    padding: 8px;
    font-weight: bold;
}

.calendar-day {
    background: rgba(0, 0, 0, 0.55);
    border-radius: 14px;
    padding: 8px 4px;
    text-align: center;
    transition: 0.2s;
    cursor: pointer;
    min-height: 70px;
    position: relative;
    border: 1px solid rgba(255, 102, 0, 0.3);
}

.calendar-day:hover {
    background: rgba(255, 102, 0, 0.2);
    transform: scale(0.98);
}

.calendar-day.today {
    border: 2px solid #ff6600;
    background: rgba(255, 102, 0, 0.3);
}

.calendar-day-number {
    font-size: 1rem;
    font-weight: bold;
    margin-bottom: 5px;
    color: #ffaa66;
}

.calendar-day.has-note::after {
    content: "";
    position: absolute;
    bottom: 3px;
    right: 6px;
    font-size: 0.6rem;
    opacity: 0.8;
}

.calendar-note-preview {
    font-size: 0.6rem;
    color: #ffaa66;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-top: 4px;
}

/* Thời tiết */
.weather-info {
    text-align: center;
    padding: 15px;
}

.weather-location {
    font-size: 1rem;
    font-weight: 500;
    color: #ffaa66;
    margin-bottom: 8px;
}

.weather-temp {
    font-size: 2.8rem;
    font-weight: bold;
    color: #ffaa44;
}

.weather-desc {
    font-size: 1rem;
    margin: 10px 0;
    color: #ffbb88;
}

.btn {
    display: inline-block;
    padding: 8px 20px;
    border-radius: 40px;
    background: linear-gradient(90deg, #ff7a1a, #ff4d00);
    color: white;
    font-weight: bold;
    transition: 0.3s;
    border: none;
    cursor: pointer;
    font-size: 0.8rem;
    margin-top: 15px;
    box-shadow: 0 2px 8px rgba(255, 102, 0, 0.3);
}

.btn-outline {
    background: transparent;
    border: 1px solid #ff7a1a;
    color: #ffb066;
}

.btn-outline:hover {
    background: #ff6600;
    color: #000;
    box-shadow: 0 4px 12px rgba(255, 102, 0, 0.5);
}

/* Link Card - Icon lớn ở giữa, không có mô tả */
.link-card {
    text-align: center;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px 20px;
}

.link-icon {
    font-size: 3.5rem;
    margin-bottom: 16px;
}

.link-icon i {
    color: #ffaa44;
    transition: all 0.3s ease;
}

.link-title {
    font-size: 1rem;
    font-weight: 600;
    color: #ffd9b3;
    letter-spacing: 0.5px;
}

.link-card:hover .link-icon i {
    transform: scale(1.1);
    color: #ff8844;
    text-shadow: 0 0 10px rgba(255, 136, 68, 0.5);
}

.link-card:hover .link-title {
    color: #ffaa66;
}
.status {
    font-size: 0.75rem;
    color: #ccaa77;
    margin-top: 10px;
    text-align: center;
}

.loading {
    text-align: center;
    padding: 30px;
    color: #ccaa77;
}

.loading-spinner {
    width: 28px;
    height: 28px;
    border: 3px solid #331a00;
    border-top-color: #ff6600;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 10px;
}
#spotify-login-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    background: linear-gradient(90deg, #020202, #000000);
    border: none;
    color:#ccaa77;
    font-weight: bold;
    padding: 10px 20px;
    border-radius: 40px;
    cursor: pointer;
    transition: 0.3s;
    font-size: 0.85rem;
    margin-top: 10px;
}

#spotify-login-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 14px rgba(255, 102, 0, 0.4);
    background: linear-gradient(90deg, #ffa16a, #fba973);
    color:black;
}

#spotify-login-btn i {
    font-size: 1rem;
    color: #ccaa77;
}

/* Các nút khác đồng bộ */
.btn, .btn-outline {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

.btn i, .btn-outline i {
    font-size: 0.9rem;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* Link Card */
.link-card {
    text-align: center;
    cursor: pointer;
}

.link-card .card-header {
    justify-content: center;
}

.link-card-content {
    padding: 30px 20px;
    font-size: 1.1rem;
    font-weight: 500;
    color: #ffaa88;
}

.link-card:hover .link-card-content {
    color: #ff6600;
}

/* Scrollbar */
::-webkit-scrollbar {
    width: 5px;
}
::-webkit-scrollbar-track {
    background: #0a0500;
}
::-webkit-scrollbar-thumb {
    background: #ff6600;
    border-radius: 10px;
}
.track-meta i.fa-clock {
    color: #ff8844;
    margin-right: 5px;
}
/* Responsive */
@media (max-width: 1100px) {
    .link-grid, .content-grid {
        grid-template-columns: repeat(2, 1fr);
    }
    .bottom-grid {
        grid-template-columns: 1fr;
    }
}
@media (max-width: 700px) {
    .link-grid, .content-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>
<body>

<div class="container">
    <h1>PERSONAL STATS</h1>
    <br><br>
    

    <!-- 4 CARD LINK ĐẦU - ĐÃ THAY ICON FONT AWESOME MÀU CAM -->
    <!-- 4 CARD LINK ĐẦU - Icon lớn ở giữa + tiêu đề bên dưới -->
<div class="link-grid">
    <div class="card link-card" onclick="location.href='calendar.html'">
        <div class="link-icon">
            <i class="fas fa-calendar-alt"></i>
        </div>
        <div class="link-title">LỊCH & GHI CHÚ</div>
    </div>
    
    <div class="card link-card" onclick="location.href='spotify.html'">
        <div class="link-icon">
            <i class="fab fa-spotify"></i>
        </div>
        <div class="link-title">SPOTIFY STATS</div>
    </div>
    
    <div class="card link-card" onclick="location.href='rank-anime.html'">
        <div class="link-icon">
            <i class="fa-brands fa-bilibili"></i>
        </div>
        <div class="link-title">RANKING ANIME</div>
    </div>
    
    <div class="card link-card" onclick="location.href='rank-movie.html'">
        <div class="link-icon">
            <i class="fas fa-film"></i>
        </div>
        <div class="link-title">RANKING MOVIE</div>
    </div>
</div>

    <!-- 3 CARD NỘI DUNG CHÍNH -->
    <div class="content-grid">
        <!-- Codeforces -->
        <div class="card">
            <div class="card-header">
                <div class="card-header-left">
                    <i class="fas fa-code" style="color: #ffaa44;"></i>
                    CODEFORCES CONTESTS
                </div>
                
            </div>
            <div id="cf-contests-list"><div class="loading"><div class="loading-spinner"></div><p>Đang tải contest...</p></div></div>
        </div>

        <!-- Lịch 7 Ngày -->
        <div class="card">
            <div class="card-header">
                <div class="card-header-left">
                    <i class="fas fa-calendar-week" style="color: #ffaa44;"></i>
                    LỊCH 7 NGÀY TỚI
                </div>
            </div>
            <div id="calendar-week-view"><div class="loading"><div class="loading-spinner"></div><p>Đang tải lịch...</p></div></div>
            <button class="btn btn-outline" onclick="location.href='calendar.html'"><i class="fas fa-edit"></i> Quản lý ghi chú</button>
        </div>

        <!-- Thời tiết -->
        <div class="card">
            <div class="card-header">
                <div class="card-header-left">
                    <i class="fas fa-cloud-sun" style="color: #ffaa44;"></i>
                    THỜI TIẾT HÔM NAY
                </div>
            </div>
            <div id="weather-info"><div class="loading"><div class="loading-spinner"></div><p>Đang lấy dữ liệu...</p></div></div>
        </div>
    </div>

    <!-- 2 CARD CUỐI: Anime Hot + Spotify Top Tracks -->
    <div class="bottom-grid">
        <div class="card">
            <div class="card-header">
                <div class="card-header-left">
                    <i class="fa-brands fa-bilibili" style="color: #ffaa44;"></i>
                    TOP 10 ANIME THỊNH HÀNH
                </div>
                
            </div>
            <div id="anime-list"><div class="loading"><div class="loading-spinner"></div><p>Đang tải anime...</p></div></div>
        </div>
        <div class="card">
            <div class="card-header">
                <div class="card-header-left">
                    <i class="fas fa-music" style="color: #ffaa44;"></i>
                    TOP 10 BÀI HÁT YÊU THÍCH
                </div>
            </div>
            <div id="spotify-user-info"></div>
            <div id="spotify-top-tracks"><div class="loading"><div class="loading-spinner"></div><p>Đang kiểm tra đăng nhập...</p></div></div>
            <div class="status" id="spotify-status"></div>
            <div id="spotify-buttons">
                <button class="btn" id="spotify-login-btn" onclick="loginSpotify()" style="display:none;"><i class="fab fa-spotify"></i> Đăng nhập Spotify</button>
                <button class="btn btn-outline" id="spotify-refresh-btn" onclick="refreshSpotify()" style="display:none;"><i class="fas fa-sync-alt"></i> Cập nhật</button>
                <button class="btn btn-outline" id="spotify-logout-btn" onclick="logoutSpotify()" style="display:none;"><i class="fas fa-sign-out-alt"></i> Đăng xuất</button>
            </div>
        </div>
    </div>
</div>

<script>
    // ========== SPOTIFY ==========
    const CLIENT_ID = "cd0524eb368f45ceb21721b9543bd5d6";
    const CLIENT_SECRET = "1a9856d20b41437d9c56a29d29e55f53";
    const REDIRECT_URI = window.location.origin + window.location.pathname;
    let spotifyToken = null;

    (function autoCheckLogin() {
        const urlParams = new URLSearchParams(window.location.search);
        const authCode = urlParams.get('code');
        if (authCode) exchangeCodeForToken(authCode);
        else {
            const savedToken = localStorage.getItem('spotify_token');
            const expiry = localStorage.getItem('spotify_token_expiry');
            if (savedToken && expiry && Date.now() < parseInt(expiry)) {
                spotifyToken = savedToken;
                loadSpotifyData(spotifyToken);
            } else showLoginUI();
        }
    })();

    function showLoginUI() {
        document.getElementById('spotify-top-tracks').innerHTML = '';
        document.getElementById('spotify-status').innerHTML = '';
        document.getElementById('spotify-login-btn').style.display = 'inline-block';
        document.getElementById('spotify-refresh-btn').style.display = 'none';
        document.getElementById('spotify-logout-btn').style.display = 'none';
    }
    function showLoggedInUI() {
        document.getElementById('spotify-login-btn').style.display = 'none';
        document.getElementById('spotify-refresh-btn').style.display = 'inline-block';
        document.getElementById('spotify-logout-btn').style.display = 'inline-block';
    }
    function loginSpotify() {
        const scope = 'user-read-recently-played user-top-read user-read-private';
        const authUrl = `https://accounts.spotify.com/authorize?client_id=${CLIENT_ID}&response_type=code&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=${encodeURIComponent(scope)}&show_dialog=true`;
        window.location.href = authUrl;
    }
    function logoutSpotify() {
        localStorage.removeItem('spotify_token');
        localStorage.removeItem('spotify_token_expiry');
        spotifyToken = null;
        showLoginUI();
        document.getElementById('spotify-top-tracks').innerHTML = '<div class="status"><i class="fas fa-lock"></i> Đã đăng xuất</div>';
    }
    async function exchangeCodeForToken(code) {
        try {
            const response = await fetch('https://accounts.spotify.com/api/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'Authorization': 'Basic ' + btoa(CLIENT_ID + ':' + CLIENT_SECRET) },
                body: new URLSearchParams({ grant_type: 'authorization_code', code, redirect_uri: REDIRECT_URI })
            });
            const data = await response.json();
            if (data.access_token) {
                spotifyToken = data.access_token;
                localStorage.setItem('spotify_token', data.access_token);
                localStorage.setItem('spotify_token_expiry', Date.now() + (data.expires_in * 1000));
                window.history.replaceState({}, document.title, window.location.pathname);
                loadSpotifyData(spotifyToken);
            } else throw new Error();
        } catch(e) { showLoginUI(); }
    }
    async function loadSpotifyData(token) {
    try {
        const tracks = await (await fetch('https://api.spotify.com/v1/me/top/tracks?limit=10&time_range=medium_term', { 
            headers: { 'Authorization': `Bearer ${token}` } 
        })).json();
        
        // Tính tổng thời gian nghe của 10 bài (tính theo phút)
        let totalDurationMs = 0;
        tracks.items.forEach(t => {
            totalDurationMs += t.duration_ms;
        });
        const totalMinutes = Math.floor(totalDurationMs / 60000);
        
        let html = '<ul class="track-list">';
        tracks.items.forEach((t,i)=> {
            let img = t.album.images?.[0]?.url || '';
            // Đổi đơn vị duration_ms sang phút:giây
            const durationSec = Math.floor(t.duration_ms / 1000);
            const minutes = Math.floor(durationSec / 60);
            const seconds = durationSec % 60;
            const durationText = `${minutes}:${seconds.toString().padStart(2,'0')}`;
            
            html += `
            <li class="track-item" onclick="window.open('https://open.spotify.com/track/${t.id}','_blank')">
                <span class="track-rank">#${i+1}</span>
                ${img ? `<img class="track-img" src="${img}">` : `<div class="track-img"></div>`}
                <div class="track-info">
                    <div class="track-name">${escapeHtml(t.name)}</div>
                    <div class="track-artist">${escapeHtml(t.artists[0].name)}</div>
                    <div class="track-meta"><i class="fas fa-clock"></i> ${durationText}</div>
                </div>
            </li>`;
        });
        html += '</ul>';
        
        // Thêm tổng thời gian nghe vào status
        document.getElementById('spotify-top-tracks').innerHTML = html;
        document.getElementById('spotify-status').innerHTML = `<i class="fas fa-clock"></i> Tổng thời gian nghe: ${totalMinutes} phút | Cập nhật ${new Date().toLocaleTimeString()}`;
        showLoggedInUI();
    } catch(e) { 
        logoutSpotify(); 
    }
}
    function refreshSpotify() { if(spotifyToken) loadSpotifyData(spotifyToken); else loginSpotify(); }

    // ========== LỊCH ==========
    function loadCalendarWeek() {
        const notes = JSON.parse(localStorage.getItem('calendarNotes')) || {};
        const today = new Date();
        let week = [];
        for (let i = 0; i < 7; i++) {
            let d = new Date(today);
            d.setDate(today.getDate() + i);
            week.push(d);
        }
        const dayNames = ['CN','T2','T3','T4','T5','T6','T7'];
        let html = `<div class="calendar-week">`;
        week.forEach(d => {
            html += `<div class="calendar-day-header">${dayNames[d.getDay()]}</div>`;
        });
        week.forEach(d => {
            let key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            let note = notes[key];
            let isToday = d.toDateString() === new Date().toDateString();
            html += `
                <div class="calendar-day ${isToday?'today':''} ${note?'has-note':''}" onclick="location.href='calendar.html'">
                    <div class="calendar-day-number">${d.getDate()}</div>
                    ${note?`<div class="calendar-note-preview">${escapeHtml(note.title||'📝')}</div>`:''}
                </div>
            `;
        });
        html += '</div>';
        document.getElementById('calendar-week-view').innerHTML = html;
    }

    // ========== ANIME HOT ==========
    async function loadAnimeHot() {
        try {
            let res = await fetch('https://api.jikan.moe/v4/top/anime?filter=airing&limit=10');
            let data = await res.json();
            let html = '<ul class="track-list">';
            data.data.forEach((a,i)=> {
                let imgUrl = a.images?.jpg?.image_url || '';
                html += `<li class="track-item" onclick="window.open('${a.url}','_blank')">
                            <span class="track-rank">#${i+1}</span>
                            ${imgUrl ? `<img class="track-img" src="${imgUrl}" onerror="this.style.display='none'" alt="${escapeHtml(a.title)}">` : '<div class="track-img" style="background:#2a1a05;"></div>'}
                            <div class="track-info">
                                <div class="track-name">${escapeHtml(a.title)}</div>
                                <div class="track-meta"><i class="fas fa-star"></i>${a.score||'N/A'} |<i class="fas fa-tv"></i>${a.episodes||'?'} tập</div>
                            </div>
                         </li>`;
            });
            html += '</ul>';
            document.getElementById('anime-list').innerHTML = html;
        } catch(e) { document.getElementById('anime-list').innerHTML = '<div class="status"> Lỗi tải anime</div>'; }
    }

    // ========== CODEFORCES ==========
    async function loadCodeforces() {
        try {
            let res = await fetch('https://codeforces.com/api/contest.list');
            let data = await res.json();
            let contests = data.result.filter(c=>c.phase==='BEFORE').sort((a,b)=>a.startTimeSeconds-b.startTimeSeconds).slice(0,10);
            let html = '<ul class="track-list">';
            contests.forEach((c,i)=> {
                let start = new Date(c.startTimeSeconds * 1000);
                let hours = Math.floor(c.durationSeconds / 3600);
                let minutes = Math.floor((c.durationSeconds % 3600) / 60);
                let durationText = `${hours}h ${minutes > 0 ? minutes + 'p' : ''}`;
                let dateStr = start.toLocaleDateString('vi-VN');
                let timeStr = start.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
                html += `<li class="track-item" onclick="window.open('https://codeforces.com/contests/${c.id}','_blank')">
                            <span class="track-rank">#${i+1}</span>
                            <div class="track-info">
                                <div class="track-name">${escapeHtml(c.name)}</div>
                                <div class="track-meta"><i class="fas fa-calendar-day"></i> ${dateStr} - ${timeStr} | <i class="fas fa-hourglass-half"></i> ${durationText}</div>
                            </div>
                         </li>`;
            });
            html += '</ul>';
            document.getElementById('cf-contests-list').innerHTML = html;
        } catch(e) { document.getElementById('cf-contests-list').innerHTML = '<div class="status"> Lỗi tải contest</div>'; }
    }

    // ========== THỜI TIẾT ==========
    async function loadWeather() {
        try {
            let res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=21.0285&longitude=105.8542&current_weather=true&timezone=auto');
            let data = await res.json();
            let temp = data.current_weather.temperature;
            let code = data.current_weather.weathercode;
            let desc = code===0?'Trời quang':(code<3?'Có mây':(code<50?'U ám':(code<60?'Sương mù':'Mưa')));
            document.getElementById('weather-info').innerHTML = `<div class="weather-info">
                            <div class="weather-location"><i class="fas fa-map-marker-alt"></i> Hà Nội, Việt Nam</div>
                            <div class="weather-temp">${Math.round(temp)}°C</div>
                            <div class="weather-desc">${desc}</div>
                            <button class="btn btn-outline" onclick="loadWeather()"><i class="fas fa-sync-alt"></i> Cập nhật</button>
                        </div>`;
        } catch(e) { document.getElementById('weather-info').innerHTML = '<div class="status"> Không lấy được thời tiết</div>'; }
    }

    function escapeHtml(t) { if(!t) return ''; let d=document.createElement('div'); d.textContent=t; return d.innerHTML; }
    
    window.addEventListener('storage', e=>{ if(e.key==='calendarNotes') loadCalendarWeek(); });
    loadCalendarWeek();
    loadAnimeHot();
    loadCodeforces();
    loadWeather();
    setInterval(()=>{ loadCodeforces(); loadAnimeHot(); if(spotifyToken) loadSpotifyData(spotifyToken); }, 10*60*1000);
</script>
</body>
</html>
