<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trắc Nghiệm Phức Chất Hóa Học</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #121212;
            color: #e0e0e0;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: #1e1e1e;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            padding-bottom: 30px;
            border: 1px solid #333;
        }
        
        header {
            background: linear-gradient(135deg, #0d47a1 0%, #1976d2 100%);
            color: white;
            padding: 25px;
            text-align: center;
            border-bottom: 5px solid #1565c0;
        }
        
        header h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
        }
        
        header p {
            font-size: 1.1rem;
            opacity: 0.9;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .controls {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            background-color: #252525;
            border-bottom: 1px solid #333;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-primary {
            background-color: #1976d2;
            color: white;
        }
        
        .btn-primary:hover {
            background-color: #1565c0;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(21, 101, 192, 0.4);
        }
        
        .btn-secondary {
            background-color: #388e3c;
            color: white;
        }
        
        .btn-secondary:hover {
            background-color: #2e7d32;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(56, 142, 60, 0.4);
        }
        
        .btn-warning {
            background-color: #d32f2f;
            color: white;
        }
        
        .btn-warning:hover {
            background-color: #c62828;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(211, 47, 47, 0.4);
        }
        
        .btn-nav {
            background-color: #424242;
            color: white;
            padding: 10px 20px;
        }
        
        .btn-nav:hover {
            background-color: #616161;
        }
        
        .quiz-info {
            display: flex;
            gap: 15px;
            align-items: center;
            background-color: #2d2d2d;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
        }
        
        .info-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 15px;
        }
        
        .info-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #bb86fc;
        }
        
        .info-label {
            font-size: 0.9rem;
            color: #b0b0b0;
        }
        
        .navigation-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #252525;
            border-bottom: 1px solid #333;
        }
        
        .nav-buttons {
            display: flex;
            gap: 10px;
        }
        
        .current-question {
            font-weight: 600;
            color: #bb86fc;
            background-color: #333;
            padding: 8px 16px;
            border-radius: 20px;
        }
        
        .questions-container {
            padding: 20px;
            min-height: 500px;
            position: relative;
        }
        
        .question-card {
            background-color: #2d2d2d;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            border-left: 5px solid #1976d2;
            animation: fadeIn 0.5s ease;
            display: none;
        }
        
        .question-card.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #444;
        }
        
        .question-number {
            background: linear-gradient(135deg, #1976d2, #0d47a1);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.3);
        }
        
        .question-type {
            background-color: #d32f2f;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        
        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #ffffff;
            line-height: 1.5;
        }
        
        .options-container {
            margin-bottom: 20px;
        }
        
        .option {
            padding: 15px;
            margin-bottom: 12px;
            border: 2px solid #444;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            background-color: #363636;
        }
        
        .option:hover {
            background-color: #424242;
            border-color: #555;
        }
        
        .option.selected {
            border-color: #1976d2;
            background-color: rgba(25, 118, 210, 0.2);
        }
        
        .option.correct {
            border-color: #388e3c;
            background-color: rgba(56, 142, 60, 0.2);
        }
        
        .option.incorrect {
            border-color: #d32f2f;
            background-color: rgba(211, 47, 47, 0.2);
        }
        
        .option-label {
            background-color: #555;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }
        
        .option.selected .option-label {
            background-color: #1976d2;
        }
        
        .option.correct .option-label {
            background-color: #388e3c;
        }
        
        .option.incorrect .option-label {
            background-color: #d32f2f;
        }
        
        .option-text {
            flex-grow: 1;
        }
        
        .true-false-container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .true-false-btn {
            flex: 1;
            padding: 18px;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            border: 3px solid transparent;
        }
        
        .true-btn {
            background-color: rgba(56, 142, 60, 0.2);
            color: #81c784;
            border-color: #388e3c;
        }
        
        .false-btn {
            background-color: rgba(211, 47, 47, 0.2);
            color: #ef9a9a;
            border-color: #d32f2f;
        }
        
        .true-btn:hover, .true-btn.selected {
            background-color: #388e3c;
            color: white;
            border-color: #2e7d32;
        }
        
        .false-btn:hover, .false-btn.selected {
            background-color: #d32f2f;
            color: white;
            border-color: #c62828;
        }
        
        .explanation {
            background-color: #333;
            border-radius: 8px;
            padding: 20px;
            margin-top: 25px;
            border-left: 4px solid #ff9800;
            animation: slideDown 0.5s ease;
            display: none;
        }
        
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .explanation-title {
            font-weight: 700;
            color: #ff9800;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.1rem;
        }
        
        .explanation-content {
            color: #e0e0e0;
            line-height: 1.6;
        }
        
        .explanation-content p {
            margin-bottom: 10px;
        }
        
        .short-answer-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #444;
            border-radius: 8px;
            font-size: 1.1rem;
            margin-bottom: 15px;
            background-color: #363636;
            color: white;
        }
        
        .short-answer-input:focus {
            outline: none;
            border-color: #1976d2;
            box-shadow: 0 0 0 2px rgba(25, 118, 210, 0.2);
        }
        
        .check-answer-btn {
            padding: 12px 25px;
            background-color: #7b1fa2;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .check-answer-btn:hover {
            background-color: #6a1b9a;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(123, 31, 162, 0.4);
        }
        
        .result-message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            display: none;
            animation: fadeIn 0.5s ease;
        }
        
        .correct-message {
            background-color: rgba(56, 142, 60, 0.2);
            color: #81c784;
            border: 1px solid #388e3c;
        }
        
        .incorrect-message {
            background-color: rgba(211, 47, 47, 0.2);
            color: #ef9a9a;
            border: 1px solid #d32f2f;
        }
        
        .progress-bar {
            height: 8px;
            background-color: #333;
            border-radius: 4px;
            margin: 20px 0;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #1976d2, #388e3c);
            width: 0%;
            transition: width 0.5s ease;
        }
        
        .footer {
            text-align: center;
            padding: 20px;
            color: #888;
            font-size: 0.9rem;
            border-top: 1px solid #333;
            margin-top: 20px;
        }
        
        .question-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 20px;
            background-color: #252525;
            border-bottom: 1px solid #333;
            justify-content: center;
        }
        
        .question-indicator {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: 600;
            background-color: #424242;
            color: #e0e0e0;
            transition: all 0.3s ease;
        }
        
        .question-indicator:hover {
            background-color: #555;
            transform: scale(1.1);
        }
        
        .question-indicator.answered {
            background-color: #1976d2;
            color: white;
        }
        
        .question-indicator.current {
            background-color: #ff9800;
            color: white;
            transform: scale(1.1);
            box-shadow: 0 0 10px rgba(255, 152, 0, 0.5);
        }
        
        .question-indicator.correct {
            background-color: #388e3c;
            color: white;
        }
        
        .question-indicator.incorrect {
            background-color: #d32f2f;
            color: white;
        }
        
        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            .quiz-info {
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .true-false-container {
                flex-direction: column;
            }
            
            header h1 {
                font-size: 1.8rem;
            }
            
            .question-text {
                font-size: 1.1rem;
            }
            
            .navigation-controls {
                flex-direction: column;
                gap: 15px;
            }
            
            .nav-buttons {
                width: 100%;
                justify-content: center;
            }
        }
          /* CSS giữ nguyên như trước, chỉ thay đổi phần sau: */
        
        .question-indicator.answered {
            background-color: #1976d2; /* XANH DƯƠNG = Đã trả lời (chưa kiểm tra) */
            color: white;
        }
        
        .question-indicator.correct {
            background-color: #388e3c; /* XANH LÁ = Đúng */
            color: white;
        }
        
        .question-indicator.incorrect {
            background-color: #d32f2f; /* ĐỎ = Sai */
            color: white;
        }
        
        .question-indicator.current {
            background-color: #ff9800; /* CAM = Câu hiện tại */
            color: white;
            transform: scale(1.1);
            box-shadow: 0 0 10px rgba(255, 152, 0, 0.5);
        }
        
        /* Thêm phần giải thích màu sắc */
        .color-legend {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        
        .color-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.85rem;
        }
        
        .color-box {
            width: 15px;
            height: 15px;
            border-radius: 3px;
        }
        
        .color-current {
            background-color: #ff9800;
        }
        
        .color-correct {
            background-color: #388e3c;
        }
        
        .color-incorrect {
            background-color: #d32f2f;
        }
        
        .color-unanswered {
            background-color: #424242;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-flask"></i> Trắc Nghiệm Phức Chất Hóa Học</h1>
            <p>Kiểm tra kiến thức về phức chất, cấu trúc, tính chất và ứng dụng trong hóa học</p>
        </header>
        
        <div class="controls">
            <div>
                <button class="btn btn-primary" id="shuffleBtn">
                    <i class="fas fa-random"></i> Xáo Trộn Câu Hỏi
                </button>
                <button class="btn btn-secondary" id="checkAllBtn">
                    <i class="fas fa-check-circle"></i> Kiểm Tra Tất Cả
                </button>
            </div>
            
            <div class="quiz-info">
                <div class="info-item">
                    <div class="info-value" id="totalQuestions">48</div>
                    <div class="info-label">Tổng câu hỏi</div>
                </div>
                <div class="info-item">
                    <div class="info-value" id="answeredQuestions">0</div>
                    <div class="info-label">Đã trả lời</div>
                </div>
                <div class="info-item">
                    <div class="info-value" id="correctAnswers">0</div>
                    <div class="info-label">Câu đúng</div>
                </div>
            </div>
            
            <button class="btn btn-warning" id="resetBtn">
                <i class="fas fa-redo"></i> Làm Lại Tất Cả
            </button>
        </div>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        
        <div class="question-list" id="questionList">
            <!-- Các chỉ báo câu hỏi sẽ được thêm ở đây -->
        </div>
        
        <div class="navigation-controls">
            <div class="nav-buttons">
                <button class="btn btn-nav" id="prevBtn">
                    <i class="fas fa-chevron-left"></i> Câu trước
                </button>
                <button class="btn btn-nav" id="nextBtn">
                    Câu sau <i class="fas fa-chevron-right"></i>
                </button>
            </div>
            <div class="current-question" id="currentQuestionDisplay">
                Câu 1/48
            </div>
        </div>
        
        <div class="questions-container" id="questionsContainer">
            <!-- Câu hỏi sẽ được thêm động bằng JavaScript -->
        </div>
        
        <div class="footer">
            <p>Trang web trắc nghiệm phức chất hóa học | Dữ liệu từ tài liệu học tập</p>
            <p>© 2023 - Thiết kế cho mục đích học tập</p>
        </div>
    </div>
    
    <script>
        // Dữ liệu câu hỏi trắc nghiệm
        const questionsData = [
            // Câu 1-15: Trắc nghiệm nhiều phương án lựa chọn
            {
                id: 1,
                type: "multiple-choice",
                text: "Phức chất của ion kim loại chuyển tiếp thường có 2 thành phần là",
                options: [
                    "phối tử và ion trung tâm.",
                    "ion dương và ion âm.",
                    "ion âm và các nguyên tử.",
                    "các nguyên tử và phân tử."
                ],
                correctAnswer: 0,
                explanation: "Phức chất của ion kim loại chuyển tiếp gồm ion kim loại trung tâm và các phối tử (ligand) bao quanh. Các phối tử có thể là phân tử trung hòa hoặc ion âm."
            },
            {
                id: 2,
                type: "multiple-choice",
                text: "Thuốc thử Tollens chứa hợp chất có công thức là [Ag(NH₃)₂]OH, có khả năng tham gia phản ứng tráng bạc với aldehyde. Phân tử [Ag(NH₃)₂]OH hoặc cation [Ag(NH₃)₂]⁺ đều được gọi là phức chất. Chọn phát biểu đúng về phức chất.",
                options: [
                    "Phức chất là phân tử hoặc ion trong đó có nguyên tử trung tâm liên kết với các phối tử bao quanh bởi hiện tượng nhận định.",
                    "Phức chất là những chất gồm nhiều phân tử chất đơn giản kết hợp lại.",
                    "Phức chất là những chất được tạo thành từ hai hay nhiều phân tử muối.",
                    "Phức chất là những hợp chất có chứa nguyên tử kim loại và có liên kết cho nhận."
                ],
                correctAnswer: 3,
                explanation: "Phức chất là những hợp chất trong đó có nguyên tử kim loại trung tâm liên kết với các phối tử (ligand) bằng liên kết cho-nhận (phối trí). Nguyên tử trung tâm thường là ion kim loại, nhận cặp electron từ phối tử."
            },
            {
                id: 3,
                type: "multiple-choice",
                text: "Phát biểu nào về phức chất [Ni(CN)₄]²⁻ sai?",
                options: [
                    "Ion trung tâm là Ni.",
                    "Dạng hình học vuông phẳng.",
                    "Phối tử là CN⁻.",
                    "Phối tử là [Ni(CN)₄]²⁻."
                ],
                correctAnswer: 3,
                explanation: "Trong phức chất [Ni(CN)₄]²⁻, ion trung tâm là Ni²⁺, phối tử là CN⁻ (xyanua). [Ni(CN)₄]²⁻ là toàn bộ ion phức, không phải là phối tử."
            },
            {
                id: 4,
                type: "multiple-choice",
                text: "Điều kiện cơ bản để phản ứng thế phối tử xảy ra trong dung dịch nước là",
                options: [
                    "không cần điều kiện.",
                    "phức chất mới hình thành phải kém bền hơn phức chất ban đầu.",
                    "phức chất mới phải khó tan.",
                    "phức chất mới hình thành phải bền hơn phức chất ban đầu."
                ],
                correctAnswer: 3,
                explanation: "Phản ứng thế phối tử xảy ra khi phức chất mới hình thành bền hơn phức chất ban đầu, làm cho cân bằng chuyển dịch theo chiều tạo phức chất mới."
            },
            {
                id: 5,
                type: "multiple-choice",
                text: "Xác định các thành phần trong phức chất [Cu(H₂O)₆]²⁺",
                options: [
                    "Phối tử là Cu²⁺, ion trung tâm là H₂O.",
                    "Phối tử là Cu²⁺, ion trung tâm là H₂O⁺.",
                    "Phối tử là H₂O, ion trung tâm là Cu²⁺.",
                    "Phối tử là H₂O, ion trung tâm là Cu⁺."
                ],
                correctAnswer: 2,
                explanation: "Trong phức chất [Cu(H₂O)₆]²⁺, ion trung tâm là Cu²⁺, còn H₂O là phối tử (ligand). Mỗi phân tử H₂O cho một cặp electron chưa liên kết vào orbital trống của Cu²⁺."
            },
            {
                id: 6,
                type: "multiple-choice",
                text: "Trong phức chất, liên kết được hình thành giữa ion trung tâm và phối tử là liên kết",
                options: [
                    "cộng hóa trị có cực.",
                    "ion.",
                    "Cho-nhận.",
                    "kim loại."
                ],
                correctAnswer: 2,
                explanation: "Liên kết trong phức chất là liên kết cho-nhận (phối trí), trong đó phối tử cho cặp electron chưa liên kết vào orbital trống của ion kim loại trung tâm."
            },
            {
                id: 7,
                type: "multiple-choice",
                text: "Ion trung tâm đóng vai trò là chất",
                options: [

            {

            {

                correctAnswer: "1:3:6:6",
                explanation: "Giả sử 100g hợp chất: m_Cr=13g, m_Br=60g, m_H=3g, m_O=24g. Số mol: n_Cr=13/52=0,25; n_Br=60/80=0,75; n_H=3/1=3; n_O=24/16=1,5. Tỉ lệ: Cr:Br:H:O = 0,25:0,75:3:1,5 = 1:3:12:6. Công thức thực nghiệm: CrBr₃H₁₂O₆ hay [Cr(H₂O)₆]Br₃. Vậy x:y:z:w = 1:3:12:6."

        // Biến toàn cục
        let currentQuestions = [];
        let userAnswers = {};
        let score = 0;
        let currentQuestionIndex = 0;
        let questionStatus = {}; // Lưu trạng thái của từng câu hỏi: null, 'answered', 'correct', 'incorrect'
        
        // Khởi tạo trang
        document.addEventListener('DOMContentLoaded', function() {
            initQuiz();
            setupEventListeners();
        });
        
        // Khởi tạo bài trắc nghiệm
        function initQuiz() {
            currentQuestions = [...questionsData];
            userAnswers = {};
            score = 0;
            currentQuestionIndex = 0;
            questionStatus = {};
            
            // Khởi tạo trạng thái câu hỏi
            currentQuestions.forEach(q => {
                questionStatus[q.id] = null;
            });
            
            renderQuestionList();
            renderCurrentQuestion();
            updateProgress();
            updateNavigationButtons();
        }
        
        // Thiết lập sự kiện
        function setupEventListeners() {
            document.getElementById('shuffleBtn').addEventListener('click', shuffleQuestions);
            document.getElementById('checkAllBtn').addEventListener('click', checkAllAnswers);
            document.getElementById('resetBtn').addEventListener('click', resetQuiz);
            document.getElementById('prevBtn').addEventListener('click', showPreviousQuestion);
            document.getElementById('nextBtn').addEventListener('click', showNextQuestion);
        }
        
        // Hiển thị danh sách câu hỏi (các chỉ báo)
        function renderQuestionList() {
            const container = document.getElementById('questionList');
            container.innerHTML = '';
            
            currentQuestions.forEach((question, index) => {
                const indicator = document.createElement('div');
                indicator.className = 'question-indicator';
                indicator.textContent = index + 1;
                indicator.dataset.questionIndex = index;
                
                // Đặt trạng thái cho chỉ báo
                if (index === currentQuestionIndex) {
                    indicator.classList.add('current');
                }
                
                if (questionStatus[question.id] === 'answered') {
                    indicator.classList.add('answered');
                } else if (questionStatus[question.id] === 'correct') {
                    indicator.classList.add('correct');
                } else if (questionStatus[question.id] === 'incorrect') {
                    indicator.classList.add('incorrect');
                }
                
                indicator.addEventListener('click', () => {
                    currentQuestionIndex = index;
                    renderCurrentQuestion();
                    updateQuestionListIndicators();
                    updateNavigationButtons();
                });
                
                container.appendChild(indicator);
            });
        }
        
        // Cập nhật chỉ báo danh sách câu hỏi
        function updateQuestionListIndicators() {
            const indicators = document.querySelectorAll('.question-indicator');
            
            indicators.forEach((indicator, index) => {
                indicator.classList.remove('current');
                
                if (index === currentQuestionIndex) {
                    indicator.classList.add('current');
                }
                
                const questionId = currentQuestions[index].id;
                
                // Cập nhật trạng thái
                indicator.classList.remove('answered', 'correct', 'incorrect');
                
                if (questionStatus[questionId] === 'answered') {
                    indicator.classList.add('answered');
                } else if (questionStatus[questionId] === 'correct') {
                    indicator.classList.add('correct');
                } else if (questionStatus[questionId] === 'incorrect') {
                    indicator.classList.add('incorrect');
                }
            });
        }
        
        // Hiển thị câu hỏi hiện tại
        function renderCurrentQuestion() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';
            
            if (currentQuestions.length === 0) return;
            
            const question = currentQuestions[currentQuestionIndex];
            const questionElement = createQuestionElement(question);
            container.appendChild(questionElement);
            
            // Cập nhật hiển thị câu hỏi hiện tại
            document.getElementById('currentQuestionDisplay').textContent = 
                `Câu ${currentQuestionIndex + 1}/${currentQuestions.length}`;
            
            // Nếu câu hỏi đã được trả lời, hiển thị kết quả ngay
            if (userAnswers[question.id] !== undefined && userAnswers[question.id] !== null && userAnswers[question.id] !== '') {
                if (question.type === 'short-answer') {
                    const input = document.getElementById(`short-answer-${question.id}`);
                    if (input) {
                        const resultMessage = document.getElementById(`result-${question.id}`);
                        const explanation = document.getElementById(`explanation-${question.id}`);
                        
                        if (resultMessage && explanation && questionStatus[question.id] !== null) {
                            resultMessage.style.display = 'block';
                            explanation.style.display = 'block';
                        }
                    }
                } else {
                    const explanation = document.getElementById(`explanation-${question.id}`);
                    if (explanation) {
                        explanation.style.display = 'block';
                        checkAnswer(question.id);
                    }
                }
            }
        }
        
        // Tạo phần tử câu hỏi
        function createQuestionElement(question) {
            const questionCard = document.createElement('div');
            questionCard.className = 'question-card active';
            questionCard.id = `question-${question.id}`;
            
            // Header với số câu và loại câu hỏi
            const header = document.createElement('div');
            header.className = 'question-header';
            
            const questionNumber = document.createElement('div');
            questionNumber.className = 'question-number';
            questionNumber.textContent = question.id;
            
            const questionType = document.createElement('div');
            questionType.className = 'question-type';
            
            if (question.type === 'multiple-choice') {
                questionType.textContent = 'Trắc nghiệm';
                questionType.style.backgroundColor = '#1976d2';
            } else if (question.type === 'true-false') {
                questionType.textContent = 'Đúng/Sai';
                questionType.style.backgroundColor = '#d32f2f';
            } else if (question.type === 'short-answer') {
                questionType.textContent = 'Trả lời ngắn';
                questionType.style.backgroundColor = '#388e3c';
            }
            
            header.appendChild(questionNumber);
            header.appendChild(questionType);
            
            // Nội dung câu hỏi
            const questionText = document.createElement('div');
            questionText.className = 'question-text';
            questionText.textContent = `Câu ${question.id}: ${question.text}`;
            
            questionCard.appendChild(header);
            questionCard.appendChild(questionText);
            
            // Thêm phần lựa chọn tùy theo loại câu hỏi
            if (question.type === 'multiple-choice') {
                questionCard.appendChild(createMultipleChoiceOptions(question));
            } else if (question.type === 'true-false') {
                questionCard.appendChild(createTrueFalseOptions(question));
            } else if (question.type === 'short-answer') {
                questionCard.appendChild(createShortAnswerInput(question));
            }
            
            // Thêm phần giải thích
            const explanation = document.createElement('div');
            explanation.className = 'explanation';
            explanation.id = `explanation-${question.id}`;
            
            const explanationTitle = document.createElement('div');
            explanationTitle.className = 'explanation-title';
            explanationTitle.innerHTML = '<i class="fas fa-lightbulb"></i> Giải thích';
            
            const explanationContent = document.createElement('div');
            explanationContent.className = 'explanation-content';
            
            if (question.type === 'true-false') {
                explanationContent.innerHTML = question.subQuestions.map((subQ, i) => 
                    `<p><strong>${String.fromCharCode(97 + i)}. ${subQ.text}</strong><br>${subQ.explanation}</p>`
                ).join('');
            } else {
                explanationContent.textContent = question.explanation;
            }
            
            explanation.appendChild(explanationTitle);
            explanation.appendChild(explanationContent);
            questionCard.appendChild(explanation);
            
            return questionCard;
        }
        
        // Tạo lựa chọn cho câu hỏi nhiều phương án
        function createMultipleChoiceOptions(question) {
            const optionsContainer = document.createElement('div');
            optionsContainer.className = 'options-container';
            
            question.options.forEach((option, index) => {
                const optionElement = document.createElement('div');
                optionElement.className = 'option';
                if (userAnswers[question.id] === index) {
                    optionElement.classList.add('selected');
                }
                
                optionElement.dataset.optionIndex = index;
                optionElement.addEventListener('click', () => {
                    selectMultipleChoiceOption(question.id, index);
                    // Tự động hiển thị đáp án và giải thích
                    setTimeout(() => {
                        checkAnswer(question.id);
                        const explanation = document.getElementById(`explanation-${question.id}`);
                        explanation.style.display = 'block';
                    }, 100);
                });
                
                const optionLabel = document.createElement('div');
                optionLabel.className = 'option-label';
                optionLabel.textContent = String.fromCharCode(65 + index); // A, B, C, D
                
                const optionText = document.createElement('div');
                optionText.className = 'option-text';
                optionText.textContent = option;
                
                optionElement.appendChild(optionLabel);
                optionElement.appendChild(optionText);
                optionsContainer.appendChild(optionElement);
            });
            
            return optionsContainer;
        }
        
        // Tạo lựa chọn cho câu hỏi đúng/sai
        function createTrueFalseOptions(question) {
            const container = document.createElement('div');
            
            question.subQuestions.forEach((subQuestion, subIndex) => {
                const subQuestionText = document.createElement('div');
                subQuestionText.className = 'question-text';
                subQuestionText.style.fontSize = '1rem';
                subQuestionText.style.marginBottom = '10px';
                subQuestionText.style.color = '#cccccc';
                subQuestionText.textContent = `${String.fromCharCode(97 + subIndex)}. ${subQuestion.text}`;
                container.appendChild(subQuestionText);
                
                const trueFalseContainer = document.createElement('div');
                trueFalseContainer.className = 'true-false-container';
                
                const trueBtn = document.createElement('div');
                trueBtn.className = 'true-false-btn true-btn';
                trueBtn.textContent = 'ĐÚNG';
                if (userAnswers[question.id] && userAnswers[question.id][subIndex] === true) {
                    trueBtn.classList.add('selected');
                }
                trueBtn.addEventListener('click', () => {
                    selectTrueFalseOption(question.id, subIndex, true);
                    // Tự động kiểm tra khi tất cả các ý đã được trả lời
                    setTimeout(() => {
                        if (userAnswers[question.id] && userAnswers[question.id].length === question.subQuestions.length) {
                            checkAnswer(question.id);
                            const explanation = document.getElementById(`explanation-${question.id}`);
                            explanation.style.display = 'block';
                        }
                    }, 100);
                });
                
                const falseBtn = document.createElement('div');
                falseBtn.className = 'true-false-btn false-btn';
                falseBtn.textContent = 'SAI';
                if (userAnswers[question.id] && userAnswers[question.id][subIndex] === false) {
                    falseBtn.classList.add('selected');
                }
                falseBtn.addEventListener('click', () => {
                    selectTrueFalseOption(question.id, subIndex, false);
                    // Tự động kiểm tra khi tất cả các ý đã được trả lời
                    setTimeout(() => {
                        if (userAnswers[question.id] && userAnswers[question.id].length === question.subQuestions.length) {
                            checkAnswer(question.id);
                            const explanation = document.getElementById(`explanation-${question.id}`);
                            explanation.style.display = 'block';
                        }
                    }, 100);
                });
                
                trueFalseContainer.appendChild(trueBtn);
                trueFalseContainer.appendChild(falseBtn);
                container.appendChild(trueFalseContainer);
            });
            
            return container;
        }
        
        // Tạo input cho câu hỏi trả lời ngắn
        function createShortAnswerInput(question) {
            const container = document.createElement('div');
            
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'short-answer-input';
            input.placeholder = 'Nhập câu trả lời của bạn...';
            input.id = `short-answer-${question.id}`;
            
            if (userAnswers[question.id]) {
                input.value = userAnswers[question.id];
            }
            
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    checkShortAnswer(question.id);
                }
            });
            
            const checkButton = document.createElement('button');
            checkButton.className = 'check-answer-btn';
            checkButton.textContent = 'Kiểm tra';
            checkButton.addEventListener('click', () => checkShortAnswer(question.id));
            
            const resultMessage = document.createElement('div');
            resultMessage.id = `result-${question.id}`;
            resultMessage.className = 'result-message';
            
            container.appendChild(input);
            container.appendChild(checkButton);
            container.appendChild(resultMessage);
            
            return container;
        }
        
        // Xử lý chọn phương án trắc nghiệm
        function selectMultipleChoiceOption(questionId, optionIndex) {
            const questionCard = document.getElementById(`question-${questionId}`);
            const options = questionCard.querySelectorAll('.option');
            
            // Bỏ chọn tất cả
            options.forEach(option => {
                option.classList.remove('selected');
            });
            
            // Chọn phương án được click
            options[optionIndex].classList.add('selected');
            
            // Lưu câu trả lời
            userAnswers[questionId] = optionIndex;
            questionStatus[questionId] = 'answered';
            
            updateProgress();
            updateQuestionListIndicators();
        }
        
        // Xử lý chọn đúng/sai
        function selectTrueFalseOption(questionId, subIndex, value) {
            if (!userAnswers[questionId]) {
                userAnswers[questionId] = [];
            }
            
            userAnswers[questionId][subIndex] = value;
            
            // Cập nhật giao diện
            const questionCard = document.getElementById(`question-${questionId}`);
            const trueFalseContainers = questionCard.querySelectorAll('.true-false-container');
            
            if (trueFalseContainers[subIndex]) {
                const trueBtn = trueFalseContainers[subIndex].querySelector('.true-btn');
                const falseBtn = trueFalseContainers[subIndex].querySelector('.false-btn');
                
                trueBtn.classList.remove('selected');
                falseBtn.classList.remove('selected');
                
                if (value === true) {
                    trueBtn.classList.add('selected');
                } else {
                    falseBtn.classList.add('selected');
                }
            }
            
            // Kiểm tra xem tất cả các ý đã được trả lời chưa
            const question = currentQuestions.find(q => q.id === questionId);
            if (userAnswers[questionId].length === question.subQuestions.length) {
                questionStatus[questionId] = 'answered';
            }
            
            updateProgress();
            updateQuestionListIndicators();
        }
        
        // Kiểm tra câu trả lời ngắn
        function checkShortAnswer(questionId) {
            const question = currentQuestions.find(q => q.id === questionId);
            const input = document.getElementById(`short-answer-${questionId}`);
            const resultMessage = document.getElementById(`result-${questionId}`);
            const explanation = document.getElementById(`explanation-${questionId}`);
            
            const userAnswer = input.value.trim().toLowerCase();
            const correctAnswer = question.correctAnswer.toString().toLowerCase();
            
            // Lưu câu trả lời
            userAnswers[questionId] = userAnswer;
            
            // So sánh câu trả lời (cho phép sai số nhỏ)
            const isCorrect = userAnswer === correctAnswer || 
                             (parseInt(userAnswer) === parseInt(correctAnswer));
            
            if (isCorrect) {
                resultMessage.textContent = '✓ Câu trả lời đúng!';
                resultMessage.className = 'result-message correct-message';
                questionStatus[questionId] = 'correct';
                score++;
            } else {
                resultMessage.textContent = `✗ Câu trả lời sai. Đáp án đúng là: ${question.correctAnswer}`;
                resultMessage.className = 'result-message incorrect-message';
                questionStatus[questionId] = 'incorrect';
            }
            
            resultMessage.style.display = 'block';
            explanation.style.display = 'block';
            
            updateProgress();
            updateQuestionListIndicators();
        }
        
        // Kiểm tra câu trả lời
        function checkAnswer(questionId) {
            const question = currentQuestions.find(q => q.id === questionId);
            const questionCard = document.getElementById(`question-${questionId}`);
            
            if (!userAnswers[questionId] && question.type !== 'true-false') {
                return false; // Chưa trả lời
            }
            
            let isCorrect = false;
            
            if (question.type === 'multiple-choice') {
                isCorrect = userAnswers[questionId] === question.correctAnswer;
                
                // Đánh dấu phương án đúng/sai
                const options = questionCard.querySelectorAll('.option');
                options.forEach((option, index) => {
                    option.classList.remove('correct', 'incorrect');
                    
                    if (index === question.correctAnswer) {
                        option.classList.add('correct');
                    } else if (index === userAnswers[questionId] && index !== question.correctAnswer) {
                        option.classList.add('incorrect');
                    }
                });
                
                if (isCorrect) {
                    questionStatus[questionId] = 'correct';
                    score++;
                } else {
                    questionStatus[questionId] = 'incorrect';
                }
                
            } else if (question.type === 'true-false') {
                // Với câu đúng/sai, cần kiểm tra từng ý nhỏ
                let allCorrect = true;
                if (userAnswers[questionId] && userAnswers[questionId].length === question.subQuestions.length) {
                    for (let i = 0; i < question.subQuestions.length; i++) {
                        if (userAnswers[questionId][i] !== question.subQuestions[i].correctAnswer) {
                            allCorrect = false;
                            break;
                        }
                    }
                    isCorrect = allCorrect;
                } else {
                    isCorrect = false;
                }
                
                if (isCorrect) {
                    questionStatus[questionId] = 'correct';
                    score++;
                } else {
                    questionStatus[questionId] = 'incorrect';
                }
            }
            
            updateQuestionListIndicators();
            return isCorrect;
        }
        
        // Xáo trộn câu hỏi
        function shuffleQuestions() {
            // Xáo trộn mảng câu hỏi
            for (let i = currentQuestions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentQuestions[i], currentQuestions[j]] = [currentQuestions[j], currentQuestions[i]];
            }
            
            // Reset về câu đầu tiên
            currentQuestionIndex = 0;
            
            // Render lại
            renderQuestionList();
            renderCurrentQuestion();
            updateProgress();
            updateNavigationButtons();
            
            // Thông báo
            alert('Đã xáo trộn câu hỏi! Vị trí các câu hỏi đã được thay đổi ngẫu nhiên.');
        }
        
        // Kiểm tra tất cả câu trả lời
        function checkAllAnswers() {
            score = 0;
            
            currentQuestions.forEach(question => {
                if (userAnswers[question.id] !== undefined && userAnswers[question.id] !== null && userAnswers[question.id] !== '') {
                    const isCorrect = checkAnswer(question.id);
                    if (isCorrect) {
                        score++;
                    }
                    
                    // Hiển thị giải thích cho tất cả câu hỏi đã trả lời
                    const explanation = document.getElementById(`explanation-${question.id}`);
                    if (explanation) {
                        explanation.style.display = 'block';
                    }
                }
            });
            
            // Hiển thị kết quả tổng
            alert(`Bạn đã trả lời đúng ${score}/${currentQuestions.length} câu (${Math.round(score/currentQuestions.length*100)}%)`);
            
            updateProgress();
            updateQuestionListIndicators();
        }
        
        // Reset bài trắc nghiệm
        function resetQuiz() {
            if (confirm('Bạn có chắc chắn muốn làm lại tất cả câu hỏi? Tất cả câu trả lời sẽ bị xóa.')) {
                initQuiz();
                alert('Đã reset bài trắc nghiệm. Hãy bắt đầu lại!');
            }
        }
        
        // Hiển thị câu hỏi trước
        function showPreviousQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderCurrentQuestion();
                updateQuestionListIndicators();
                updateNavigationButtons();
            }
        }
        
        // Hiển thị câu hỏi tiếp theo
        function showNextQuestion() {
            if (currentQuestionIndex < currentQuestions.length - 1) {
                currentQuestionIndex++;
                renderCurrentQuestion();
                updateQuestionListIndicators();
                updateNavigationButtons();
            }
        }
        
        // Cập nhật nút điều hướng
        function updateNavigationButtons() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            
            prevBtn.disabled = currentQuestionIndex === 0;
            nextBtn.disabled = currentQuestionIndex === currentQuestions.length - 1;
            
            if (currentQuestionIndex === 0) {
                prevBtn.style.opacity = '0.5';
                prevBtn.style.cursor = 'not-allowed';
            } else {
                prevBtn.style.opacity = '1';
                prevBtn.style.cursor = 'pointer';
            }
            
            if (currentQuestionIndex === currentQuestions.length - 1) {
                nextBtn.style.opacity = '0.5';
                nextBtn.style.cursor = 'not-allowed';
            } else {
                nextBtn.style.opacity = '1';
                nextBtn.style.cursor = 'pointer';
            }
        }
        
        // Cập nhật tiến độ và thống kê
        function updateProgress() {
            const totalQuestions = currentQuestions.length;
            let answeredQuestions = 0;
            let correctCount = 0;
            
            // Đếm số câu đã trả lời và đúng
            Object.keys(questionStatus).forEach(questionId => {
                if (questionStatus[questionId] === 'answered' || questionStatus[questionId] === 'correct' || questionStatus[questionId] === 'incorrect') {
                    answeredQuestions++;
                }
                if (questionStatus[questionId] === 'correct') {
                    correctCount++;
                }
            });
            
            // Cập nhật thống kê
            document.getElementById('totalQuestions').textContent = totalQuestions;
            document.getElementById('answeredQuestions').textContent = answeredQuestions;
            document.getElementById('correctAnswers').textContent = correctCount;
            
            // Cập nhật thanh tiến độ
            const progressPercent = (answeredQuestions / totalQuestions) * 100;
            document.getElementById('progressFill').style.width = `${progressPercent}%`;
        }
        
    </script>
</body>
</html>
