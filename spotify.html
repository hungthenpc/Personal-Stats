<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Spotify Music Ranking - Tier Maker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            background: #000;
            min-height: 100vh;
            position: relative;
            color: #fff;
            padding: 20px;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 70% 20%, rgba(255,100,0,0.15), transparent 40%),
                        radial-gradient(circle at 20% 80%, rgba(255,120,0,0.12), transparent 50%),
                        linear-gradient(135deg, #000 0%, #0a0500 60%, #140800 100%);
            z-index: -2;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(1.5px 1.5px at 15% 20%, rgba(255,180,100,0.6), transparent),
                              radial-gradient(1px 1px at 75% 45%, rgba(255,140,50,0.5), transparent),
                              radial-gradient(2px 2px at 92% 80%, rgba(255,100,0,0.7), transparent);
            background-repeat: no-repeat;
            pointer-events: none;
            z-index: -1;
        }

        .back-home {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,120,40,0.4);
            padding: 8px 18px;
            border-radius: 30px;
            color: #ffaa66;
            text-decoration: none;
            z-index: 1000;
            transition: 0.3s;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-home:hover {
            background: #ff6600;
            color: #000;
            transform: translateX(-5px);
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            border: 1px solid rgba(255,102,0,0.35);
            padding: 30px 25px;
        }

        h1 {
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ffcc88, #ffaa44, #ff6600);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .sub {
            text-align: center;
            color: #ffaa77;
            margin-bottom: 30px;
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .login-area {
            text-align: center;
            margin-bottom: 35px;
        }

        .btn-spotify {
            background: linear-gradient(90deg, #ff6600, #ff4400);
            border: none;
            padding: 12px 36px;
            border-radius: 60px;
            color: #000;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(255,102,0,0.3);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-spotify:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(255,102,0,0.5);
        }

        .status {
            text-align: center;
            margin-top: 12px;
            color: #ffaa66;
            font-size: 0.8rem;
        }

        /* Main Layout */
        .ranking-layout {
            display: flex;
            gap: 25px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .top-songs-section {
            flex: 1.2;
            min-width: 320px;
        }

        .tier-section {
            flex: 2.5;
            min-width: 550px;
        }

        .card {
            background: rgba(10,10,10,0.7);
            backdrop-filter: blur(4px);
            border-radius: 24px;
            padding: 22px;
            border: 1px solid rgba(255,102,0,0.3);
            height: 100%;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid rgba(255,102,0,0.5);
            flex-wrap: wrap;
            gap: 12px;
        }

        .card-header h3 {
            color: #ffaa66;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .time-selector {
            display: flex;
            gap: 8px;
        }

        .time-btn {
            background: rgba(0,0,0,0.6);
            border: 1px solid #ff6600;
            padding: 5px 14px;
            border-radius: 30px;
            color: #ffaa66;
            cursor: pointer;
            font-size: 0.7rem;
            transition: 0.2s;
        }

        .time-btn.active {
            background: #ff6600;
            color: #000;
            box-shadow: 0 0 8px rgba(255,102,0,0.5);
        }

        .time-btn:hover:not(.active) {
            background: rgba(255,102,0,0.3);
        }

        /* Top Songs List */
        .songs-list {
            max-height: 550px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .songs-list::-webkit-scrollbar {
            width: 5px;
        }
        .songs-list::-webkit-scrollbar-track {
            background: #1a1a1a;
            border-radius: 10px;
        }
        .songs-list::-webkit-scrollbar-thumb {
            background: #ff6600;
            border-radius: 10px;
        }

        .song-item {
            background: rgba(20,20,20,0.8);
            border-radius: 14px;
            padding: 10px 12px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid rgba(255,102,0,0.25);
            cursor: grab;
            transition: 0.2s;
        }

        .song-item:active {
            cursor: grabbing;
        }

        .song-item:hover {
            background: rgba(255,102,0,0.12);
            border-color: #ff6600;
            transform: translateX(3px);
        }

        .rank-number {
            font-size: 1rem;
            font-weight: bold;
            color: #ffaa66;
            width: 40px;
            text-align: center;
        }

        .song-img {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            object-fit: cover;
            background: #2a1a0a;
        }

        .song-info {
            flex: 1;
        }

        .song-name {
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 4px;
            color: #ffcc99;
        }

        .song-artist {
            font-size: 0.7rem;
            color: #ffaa77;
        }

        .tier-badge {
            background: #ff6600;
            color: #000;
            font-size: 0.65rem;
            font-weight: bold;
            padding: 2px 10px;
            border-radius: 20px;
            margin-left: 10px;
            display: inline-block;
        }

        /* Tier Rows */
        .tier-rows-container {
            max-height: 550px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .tier-row {
            background: rgba(0,0,0,0.5);
            margin-bottom: 10px;
            border-radius: 18px;
            border: 1px solid rgba(255,102,0,0.3);
            display: flex;
            min-height: 100px;
        }

        .tier-label {
            width: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: bold;
            border-radius: 18px 0 0 18px;
            background: #2a2a2a;
        }

        .tier-label.S { background: linear-gradient(135deg, #ffaa44, #ff8800); color: #000; text-shadow: 0 0 5px rgba(255,255,0,0.5); }
        .tier-label.A { background: #c97e2e; color: #fff; }
        .tier-label.B { background: #8b5a2b; color: #fff; }
        .tier-label.C { background: #5a3a1a; color: #fff; }
        .tier-label.D { background: #3a2a1a; color: #ccc; }
        .tier-label.F { background: #1f1a15; color: #aa8866; }

        .tier-items {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            padding: 12px;
            min-height: 96px;
        }

        .tier-card {
            width: 95px;
            background: #1e1e1e;
            border-radius: 14px;
            padding: 8px 6px;
            border: 1px solid #ff6600;
            cursor: grab;
            transition: 0.2s;
            text-align: center;
            position: relative;
        }

        .tier-card:active {
            cursor: grabbing;
        }

        .tier-card:hover {
            transform: translateY(-3px);
            border-color: #ffaa44;
            box-shadow: 0 4px 12px rgba(255,102,0,0.3);
        }

        .tier-card-img {
            width: 70px;
            height: 70px;
            border-radius: 10px;
            object-fit: cover;
            margin-bottom: 5px;
        }

        .tier-card-name {
            font-size: 0.65rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #ffcc99;
        }

        .tier-card-artist {
            font-size: 0.55rem;
            color: #ffaa77;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tier-rank-icon {
            position: absolute;
            top: 5px;
            right: 5px;
            background: #ff6600;
            color: #000;
            font-weight: bold;
            font-size: 0.6rem;
            padding: 2px 8px;
            border-radius: 20px;
        }

        /* Library Section */
        .library-section {
            margin-top: 25px;
        }

        .library-card {
            background: rgba(10,10,10,0.7);
            backdrop-filter: blur(4px);
            border-radius: 24px;
            padding: 20px;
            border: 1px solid rgba(255,102,0,0.3);
        }

        .library-card h4 {
            color: #ffaa66;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1rem;
        }

        .library-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            max-height: 200px;
            overflow-y: auto;
            padding: 8px;
        }

        .library-item {
            width: 90px;
            text-align: center;
            background: rgba(30,30,30,0.9);
            border-radius: 14px;
            padding: 8px 6px;
            border: 1px solid rgba(255,102,0,0.4);
            cursor: grab;
            transition: 0.2s;
        }

        .library-item:active {
            cursor: grabbing;
        }

        .library-item:hover {
            transform: translateY(-3px);
            border-color: #ffaa44;
            background: #2a2a2a;
        }

        .library-img {
            width: 65px;
            height: 65px;
            border-radius: 10px;
            object-fit: cover;
            margin-bottom: 5px;
        }

        .library-name {
            font-size: 0.65rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #ffcc99;
        }

        .library-artist {
            font-size: 0.55rem;
            color: #ffaa77;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .action-buttons {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            justify-content: flex-end;
        }

        .reset-btn {
            background: rgba(255,102,0,0.25);
            border: 1px solid #ff6600;
            padding: 8px 20px;
            border-radius: 40px;
            color: #ffaa66;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .reset-btn:hover {
            background: rgba(255,102,0,0.45);
            transform: translateY(-2px);
        }

        .refresh-btn {
            background: linear-gradient(90deg, #ff6600, #ff4400);
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255,102,0,0.4);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-spinner {
            width: 24px;
            height: 24px;
            border: 2px solid #331a00;
            border-top-color: #ff6600;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 20px auto;
        }

        .empty-message {
            text-align: center;
            padding: 30px;
            color: #ffaa77;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
<a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> Trang chủ</a>

<div class="container">
    <h1><i class="fab fa-spotify"></i> Spotify Music Tier Ranking</h1>
    <div class="sub">Kéo thả bài hát vào bảng xếp hạng S → F | Mỗi bài sẽ hiển thị tier ở góc</div>

    <div class="login-area" id="loginArea">
        <button class="btn-spotify" id="loginBtn"><i class="fab fa-spotify"></i> Đăng nhập Spotify</button>
        <div id="loginStatus" class="status"></div>
    </div>

    <div id="mainContent" style="display: none;">
        <div class="ranking-layout">
            <!-- Top 50 Songs Section -->
            <div class="top-songs-section">
                <div class="card">
                    <div class="card-header">
                        <h3><i class="fas fa-chart-line"></i> Top 50 Bài Hát</h3>
                        <div class="time-selector" id="timeRangeSelector">
                            <button class="time-btn" data-range="short_term">4 tuần</button>
                            <button class="time-btn active" data-range="medium_term">6 tháng</button>
                            <button class="time-btn" data-range="long_term">Mọi thời gian</button>
                        </div>
                    </div>
                    <div id="topSongsList" class="songs-list">
                        <div class="loading-spinner"></div>
                    </div>
                </div>
            </div>

            <!-- Tier Ranking Section -->
            <div class="tier-section">
                <div class="card">
                    <div class="card-header">
                        <h3><i class="fas fa-trophy"></i> Xếp hạng Tier (S → F)</h3>
                        <button id="resetAllTiers" class="reset-btn"><i class="fas fa-undo-alt"></i> Đặt lại tất cả</button>
                    </div>
                    <div id="tierRowsContainer" class="tier-rows-container">
                        <div class="loading-spinner"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Library Section (Unranked Songs) -->
        <div class="library-section">
            <div class="library-card">
                <h4><i class="fas fa-music"></i> Thư viện bài hát chưa xếp hạng (Kéo thả vào bảng tier)</h4>
                <div id="libraryGrid" class="library-grid">
                    <div class="loading-spinner"></div>
                </div>
                <div class="action-buttons">
                    <button id="refreshDataBtn" class="refresh-btn"><i class="fas fa-sync-alt"></i> Cập nhật từ Spotify</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Spotify Configuration
    const CLIENT_ID = "cd0524eb368f45ceb21721b9543bd5d6";
    const CLIENT_SECRET = "1a9856d20b41437d9c56a29d29e55f53";
    const REDIRECT_URI = window.location.origin + window.location.pathname;
    let spotifyToken = null;
    
    // Data Storage
    let allSongs = []; // { id, name, artist, image }
    let songTiers = {}; // { songId: tier }
    let songPopularity = { short_term: {}, medium_term: {}, long_term: {} };
    let currentTimeRange = "medium_term";
    
    // Load saved data from localStorage
    function loadSavedData() {
        const savedSongs = localStorage.getItem('spotify_all_songs');
        const savedTiers = localStorage.getItem('spotify_song_tiers');
        const savedPop = localStorage.getItem('spotify_song_popularity');
        
        if (savedSongs) allSongs = JSON.parse(savedSongs);
        if (savedTiers) songTiers = JSON.parse(savedTiers);
        if (savedPop) songPopularity = JSON.parse(savedPop);
    }
    
    // Save data to localStorage
    function saveData() {
        localStorage.setItem('spotify_all_songs', JSON.stringify(allSongs));
        localStorage.setItem('spotify_song_tiers', JSON.stringify(songTiers));
        localStorage.setItem('spotify_song_popularity', JSON.stringify(songPopularity));
    }
    
    // Fetch top tracks from Spotify
    async function fetchTopTracks(range) {
        if (!spotifyToken) return [];
        try {
            const response = await fetch(`https://api.spotify.com/v1/me/top/tracks?limit=50&time_range=${range}`, {
                headers: { 'Authorization': `Bearer ${spotifyToken}` }
            });
            const data = await response.json();
            return data.items || [];
        } catch (error) {
            console.error('Error fetching tracks:', error);
            return [];
        }
    }
    
    // Update songs from Spotify for all time ranges
    async function updateAllSongs() {
        if (!spotifyToken) return;
        
        const ranges = ['short_term', 'medium_term', 'long_term'];
        const newSongsMap = new Map();
        
        for (const range of ranges) {
            const tracks = await fetchTopTracks(range);
            songPopularity[range] = {};
            
            for (const track of tracks) {
                const songId = track.id;
                songPopularity[range][songId] = track.popularity || 0;
                
                if (!newSongsMap.has(songId)) {
                    newSongsMap.set(songId, {
                        id: songId,
                        name: track.name,
                        artist: track.artists[0]?.name || 'Unknown',
                        image: track.album.images[0]?.url || ''
                    });
                }
            }
        }
        
        allSongs = Array.from(newSongsMap.values());
        saveData();
        
        document.getElementById('loginStatus').innerHTML = '<i class="fas fa-check-circle"></i> Đã cập nhật dữ liệu từ Spotify!';
        setTimeout(() => {
            if (document.getElementById('loginStatus')) {
                document.getElementById('loginStatus').innerHTML = '';
            }
        }, 3000);
        
        renderAll();
    }
    
    // Get top 50 songs sorted by popularity for current time range
    function getTop50Songs() {
        const popData = songPopularity[currentTimeRange] || {};
        const sorted = [...allSongs].sort((a, b) => {
            const popA = popData[a.id] || 0;
            const popB = popData[b.id] || 0;
            return popB - popA;
        });
        return sorted.slice(0, 50);
    }
    
    // Render Top 50 Songs List
    function renderTopSongs() {
        const container = document.getElementById('topSongsList');
        if (!container) return;
        
        const topSongs = getTop50Songs();
        const tier = songTiers;
        
        if (topSongs.length === 0) {
            container.innerHTML = '<div class="empty-message"><i class="fas fa-music"></i> Chưa có dữ liệu. Hãy cập nhật từ Spotify!</div>';
            return;
        }
        
        container.innerHTML = topSongs.map((song, index) => {
            const songTier = tier[song.id];
            return `
                <div class="song-item" draggable="true" data-song-id="${song.id}" data-song-name="${escapeHtml(song.name)}" data-song-artist="${escapeHtml(song.artist)}" data-song-image="${song.image}">
                    <div class="rank-number">#${index + 1}</div>
                    <img class="song-img" src="${song.image || 'https://via.placeholder.com/48?text=🎵'}" onerror="this.src='https://via.placeholder.com/48?text=🎵'">
                    <div class="song-info">
                        <div class="song-name">${escapeHtml(song.name)} ${songTier ? `<span class="tier-badge">${songTier}</span>` : ''}</div>
                        <div class="song-artist">${escapeHtml(song.artist)}</div>
                    </div>
                </div>
            `;
        }).join('');
        
        // Add drag event listeners
        document.querySelectorAll('.song-item').forEach(el => {
            el.addEventListener('dragstart', handleDragStart);
            el.addEventListener('dragend', handleDragEnd);
        });
    }
    
    // Render Tier Rows
    function renderTierRows() {
        const container = document.getElementById('tierRowsContainer');
        if (!container) return;
        
        const tiers = ['S', 'A', 'B', 'C', 'D', 'F'];
        
        container.innerHTML = tiers.map(tier => {
            const songsInTier = allSongs.filter(song => songTiers[song.id] === tier);
            
            return `
                <div class="tier-row">
                    <div class="tier-label ${tier}">${tier}</div>
                    <div class="tier-items" data-tier="${tier}" ondrop="handleDrop(event)" ondragover="handleDragOver(event)">
                        ${songsInTier.map(song => `
                            <div class="tier-card" draggable="true" data-song-id="${song.id}" data-song-name="${escapeHtml(song.name)}" data-song-artist="${escapeHtml(song.artist)}" data-song-image="${song.image}" data-current-tier="${tier}">
                                <img class="tier-card-img" src="${song.image || 'https://via.placeholder.com/70?text=🎵'}" onerror="this.src='https://via.placeholder.com/70?text=🎵'">
                                <div class="tier-card-name">${escapeHtml(song.name)}</div>
                                <div class="tier-card-artist">${escapeHtml(song.artist)}</div>
                                <div class="tier-rank-icon">${tier}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }).join('');
        
        // Add drag event listeners to tier cards
        document.querySelectorAll('.tier-card').forEach(el => {
            el.addEventListener('dragstart', handleDragStart);
            el.addEventListener('dragend', handleDragEnd);
        });
    }
    
    // Render Library (unranked songs)
    function renderLibrary() {
        const container = document.getElementById('libraryGrid');
        if (!container) return;
        
        const rankedIds = Object.keys(songTiers);
        const unrankedSongs = allSongs.filter(song => !rankedIds.includes(song.id));
        
        if (unrankedSongs.length === 0) {
            container.innerHTML = '<div class="empty-message" style="width:100%;"><i class="fas fa-check-circle"></i> Tất cả bài hát đã được xếp hạng!</div>';
            return;
        }
        
        container.innerHTML = unrankedSongs.map(song => `
            <div class="library-item" draggable="true" data-song-id="${song.id}" data-song-name="${escapeHtml(song.name)}" data-song-artist="${escapeHtml(song.artist)}" data-song-image="${song.image}">
                <img class="library-img" src="${song.image || 'https://via.placeholder.com/65?text=🎵'}" onerror="this.src='https://via.placeholder.com/65?text=🎵'">
                <div class="library-name">${escapeHtml(song.name)}</div>
                <div class="library-artist">${escapeHtml(song.artist)}</div>
            </div>
        `).join('');
        
        // Add drag event listeners
        document.querySelectorAll('.library-item').forEach(el => {
            el.addEventListener('dragstart', handleDragStart);
            el.addEventListener('dragend', handleDragEnd);
        });
    }
    
    // Drag and Drop Handlers
    let dragData = null;
    
    function handleDragStart(e) {
        const target = e.target.closest('[data-song-id]');
        if (!target) return;
        
        dragData = {
            id: target.dataset.songId,
            name: target.dataset.songName,
            artist: target.dataset.songArtist,
            image: target.dataset.songImage,
            currentTier: target.dataset.currentTier || null
        };
        
        e.dataTransfer.setData('text/plain', JSON.stringify(dragData));
        e.dataTransfer.effectAllowed = 'move';
    }
    
    function handleDragEnd(e) {
        dragData = null;
    }
    
    function handleDragOver(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
    }
    
    window.handleDrop = function(e) {
        e.preventDefault();
        const tierContainer = e.target.closest('.tier-items');
        if (!tierContainer) return;
        
        const targetTier = tierContainer.dataset.tier;
        if (!targetTier) return;
        
        try {
            const data = JSON.parse(e.dataTransfer.getData('text/plain'));
            if (data && data.id) {
                // Update tier for the song
                songTiers[data.id] = targetTier;
                saveData();
                renderAll();
            }
        } catch (error) {
            console.error('Drop error:', error);
        }
    };
    
    // Reset all tiers
    function resetAllTiers() {
        if (confirm('Bạn có chắc muốn đặt lại tất cả xếp hạng?')) {
            songTiers = {};
            saveData();
            renderAll();
        }
    }
    
    // Render everything
    function renderAll() {
        renderTopSongs();
        renderTierRows();
        renderLibrary();
    }
    
    // Spotify Authentication
    function loginSpotify() {
        const scope = 'user-top-read user-read-private';
        const authUrl = `https://accounts.spotify.com/authorize?client_id=${CLIENT_ID}&response_type=code&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=${encodeURIComponent(scope)}&show_dialog=true`;
        window.location.href = authUrl;
    }
    
    async function exchangeCodeForToken(code) {
        try {
            const response = await fetch('https://accounts.spotify.com/api/token', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    'Authorization': 'Basic ' + btoa(CLIENT_ID + ':' + CLIENT_SECRET)
                },
                body: new URLSearchParams({
                    grant_type: 'authorization_code',
                    code: code,
                    redirect_uri: REDIRECT_URI
                })
            });
            
            const data = await response.json();
            if (data.access_token) {
                spotifyToken = data.access_token;
                localStorage.setItem('spotify_token', spotifyToken);
                localStorage.setItem('spotify_token_expiry', Date.now() + (data.expires_in * 1000));
                
                window.history.replaceState({}, document.title, window.location.pathname);
                
                document.getElementById('loginArea').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                
                await updateAllSongs();
            }
        } catch (error) {
            console.error('Token exchange error:', error);
            document.getElementById('loginStatus').innerHTML = '<i class="fas fa-exclamation-triangle"></i> Đăng nhập thất bại';
        }
    }
    
    // Check existing login
    function checkExistingLogin() {
        const urlParams = new URLSearchParams(window.location.search);
        const authCode = urlParams.get('code');
        
        if (authCode) {
            exchangeCodeForToken(authCode);
        } else {
            const savedToken = localStorage.getItem('spotify_token');
            const expiry = localStorage.getItem('spotify_token_expiry');
            
            if (savedToken && expiry && Date.now() < parseInt(expiry)) {
                spotifyToken = savedToken;
                document.getElementById('loginArea').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                updateAllSongs();
            }
        }
    }
    
    // Helper function
    function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }
    
    // Event Listeners
    function setupEventListeners() {
        const timeBtns = document.querySelectorAll('#timeRangeSelector .time-btn');
        timeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                timeBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentTimeRange = btn.dataset.range;
                renderTopSongs();
            });
        });
        
        document.getElementById('resetAllTiers')?.addEventListener('click', resetAllTiers);
        document.getElementById('refreshDataBtn')?.addEventListener('click', () => updateAllSongs());
        document.getElementById('loginBtn')?.addEventListener('click', loginSpotify);
    }
    
    // Initialize
    loadSavedData();
    checkExistingLogin();
    setupEventListeners();
    
    // Initial render if data exists
    if (allSongs.length > 0) {
        renderAll();
    }
</script>
</body>
</html>
