<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            background: #000;
            min-height: 100vh;
            position: relative;
            color: #fff;
            padding: 20px;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 70% 20%, rgba(255,100,0,0.15), transparent 40%),
                        radial-gradient(circle at 20% 80%, rgba(255,120,0,0.12), transparent 50%),
                        linear-gradient(135deg, #000 0%, #0a0500 60%, #140800 100%);
            z-index: -2;
        }
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(1px 1px at 20% 30%, rgba(255,150,80,.4), transparent),
                              radial-gradient(1px 1px at 80% 70%, rgba(255,120,50,.4), transparent);
            z-index: -1;
        }

        .back-home {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,120,40,.3);
            padding: 8px 16px;
            border-radius: 30px;
            color: #ffaa66;
            text-decoration: none;
            z-index: 1000;
            transition: 0.2s;
        }
        .back-home:hover {
            background: #ff6600;
            color: #000;
        }

            max-width: 1600px;

            border: 1px solid rgba(255,102,0,0.3);
            padding: 30px 20px;
