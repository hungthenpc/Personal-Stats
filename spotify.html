<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Stats - Music Analytics</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1DB954 0%, #191414 100%);
            min-height: 100vh;
            padding: 20px;
        }

        /* Nút quay lại */
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 14px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            text-decoration: none;
        }

        .back-btn:hover {
            background: rgba(0,0,0,0.9);
            transform: translateX(-5px);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 24px;
            padding: 28px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #1DB954;
            font-size: 28px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h2 {
            color: #333;
            font-size: 20px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #f0f0f0;
        }

        .btn-spotify {
            background: #1DB954;
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-spotify:hover {
            background: #1ed760;
            transform: scale(1.02);
        }

        .btn-logout {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 20px;
            font-size: 14px;
            border-radius: 20px;
            cursor: pointer;
            float: right;
        }

        .track {
            display: flex;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #eee;
            transition: background 0.2s;
        }

        .track:hover {
            background: #f8f9fa;
        }

        .track-rank {
            font-size: 20px;
            font-weight: bold;
            width: 45px;
            color: #1DB954;
        }

        .track-img {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            margin-right: 15px;
            object-fit: cover;
        }

        .track-info {
            flex: 1;
        }

        .track-name {
            font-weight: 600;
            margin-bottom: 4px;
            color: #333;
        }

        .track-artist {
            font-size: 13px;
            color: #666;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            margin: 10px 0;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
        }

        .user-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
        }

        .user-name {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .loading {
            text-align: center;
            padding: 50px;
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #1DB954;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">← Quay lại trang chủ</a>

    <div class="container">
        <!-- Login Card -->
        <div id="loginCard" class="card" style="text-align: center;">
            <h1 style="justify-content: center;">🎵 Spotify Stats</h1>
            <p style="color: #666; margin: 10px 0;">Xem thống kê nghe nhạc Spotify của bạn</p>
            <button class="btn-spotify" onclick="loginToSpotify()">
                🔐 Đăng nhập với Spotify
            </button>
        </div>

        <!-- Dashboard -->
        <div id="dashboard" style="display: none;">
            <div class="card clearfix">
                <div id="userInfo" class="user-info"></div>
                <button class="btn-logout" onclick="logout()">Đăng xuất</button>
            </div>

            <div class="card">
                <h2>📊 Thống kê nhanh</h2>
                <div id="statsContainer"></div>
            </div>

            <div class="card">
                <h2>🏆 Top 10 bài hát yêu thích</h2>
                <div id="topTracksContainer"></div>
            </div>

            <div class="card">
                <h2>🕐 10 bài hát vừa nghe</h2>
                <div id="recentTracksContainer"></div>
            </div>
        </div>

        <!-- Loading -->
        <div id="loading" class="card loading" style="display: none;">
            <div class="spinner"></div>
            <p>Đang tải dữ liệu từ Spotify...</p>
        </div>
    </div>

    <script>
        // CẤU HÌNH
        const CLIENT_ID = "cd0524eb368f45ceb21721b9543bd5d6";
        const REDIRECT_URI = window.location.origin + window.location.pathname;
        
        // Khởi tạo
        const urlParams = new URLSearchParams(window.location.search);
        const authCode = urlParams.get('code');
        
        if (authCode) {
            exchangeCodeForToken(authCode);
        } else {
            const savedToken = localStorage.getItem('spotify_token');
            if (savedToken) {
                loadDashboard(savedToken);
            }
        }
        
        function loginToSpotify() {
            const scope = 'user-read-recently-played user-top-read user-read-private';
            const authUrl = `https://accounts.spotify.com/authorize?client_id=${CLIENT_ID}&response_type=code&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=${encodeURIComponent(scope)}&show_dialog=true`;
            window.location.href = authUrl;
        }
        
        async function exchangeCodeForToken(code) {
            showLoading(true);
            try {
                // Dùng proxy để đổi code lấy token
                const response = await fetch('https://corsproxy.io/?' + encodeURIComponent('https://accounts.spotify.com/api/token'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        grant_type: 'authorization_code',
                        code: code,
                        redirect_uri: REDIRECT_URI,
                        client_id: CLIENT_ID,
                        client_secret: '1a9856d20b41437d9c56a29d29e55f53' // Thay bằng client secret thật
                    })
                });
                
                const data = await response.json();
                if (data.access_token) {
                    localStorage.setItem('spotify_token', data.access_token);
                    window.history.replaceState({}, document.title, window.location.pathname);
                    loadDashboard(data.access_token);
                } else {
                    throw new Error('Không lấy được token');
                }
            } catch(e) {
                alert('Lỗi đăng nhập: ' + e.message);
                showLoading(false);
                document.getElementById('loginCard').style.display = 'block';
            }
        }
        
        async function loadDashboard(token) {
            showLoading(true);
            try {
                const user = await fetchAPI('https://api.spotify.com/v1/me', token);
                const top = await fetchAPI('https://api.spotify.com/v1/me/top/tracks?limit=10', token);
                const recent = await fetchAPI('https://api.spotify.com/v1/me/player/recently-played?limit=10', token);
                
                displayUser(user);
                displayStats(top, recent);
                displayTopTracks(top);
                displayRecent(recent);
                
                document.getElementById('loginCard').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
            } catch(e) {
                alert('Lỗi tải dữ liệu: ' + e.message);
                logout();
            }
            showLoading(false);
        }
        
        async function fetchAPI(url, token) {
            const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
            if (!res.ok) throw new Error('API error');
            return res.json();
        }
        
        function displayUser(user) {
            document.getElementById('userInfo').innerHTML = `
                ${user.images?.[0] ? `<img class="user-avatar" src="${user.images[0].url}">` : '<div style="width:60px;height:60px;background:#1DB954;border-radius:50%;text-align:center;line-height:60px;font-size:28px;">🎵</div>'}
                <div><div class="user-name">${user.display_name || user.id}</div><div style="color:#666">${user.email || ''}</div></div>
            `;
        }
        
        function displayStats(top, recent) {
            const tracks = top.items || [];
            const artists = {};
            tracks.forEach(t => { artists[t.artists[0].name] = (artists[t.artists[0].name] || 0) + 1; });
            const topArtist = Object.entries(artists).sort((a,b)=>b[1]-a[1])[0];
            
            let totalMs = 0;
            (recent.items || []).forEach(i => totalMs += i.track.duration_ms);
            
            document.getElementById('statsContainer').innerHTML = `
                <div class="stats-grid">
                    <div class="stat-card"><div class="stat-label">🎵 Bài hát yêu thích</div><div class="stat-number">${tracks.length}</div></div>
                    <div class="stat-card"><div class="stat-label">⭐ Nghệ sĩ yêu thích</div><div class="stat-number" style="font-size:20px">${topArtist?.[0] || 'Chưa có'}</div></div>
                    <div class="stat-card"><div class="stat-label">⏱️ Thời gian nghe (10 bài gần nhất)</div><div class="stat-number">${Math.floor(totalMs/60000)}</div><div class="stat-label">phút</div></div>
                </div>
            `;
        }
        
        function displayTopTracks(data) {
            const tracks = data.items || [];
            let html = '';
            tracks.forEach((t, i) => {
                html += `<div class="track"><div class="track-rank">#${i+1}</div>${t.album.images[0] ? `<img class="track-img" src="${t.album.images[0].url}">` : ''}<div class="track-info"><div class="track-name">${escapeHtml(t.name)}</div><div class="track-artist">${escapeHtml(t.artists[0].name)}</div></div></div>`;
            });
            document.getElementById('topTracksContainer').innerHTML = html || '<p>Chưa có dữ liệu</p>';
        }
        
        function displayRecent(data) {
            const items = data.items || [];
            let html = '';
            items.forEach(item => {
                const t = item.track;
                const time = new Date(item.played_at);
                const now = new Date();
                const diff = Math.floor((now - time) / 60000);
                const timeText = diff < 60 ? `${diff} phút trước` : `${Math.floor(diff/60)} giờ trước`;
                html += `<div class="track">${t.album.images[0] ? `<img class="track-img" src="${t.album.images[0].url}">` : ''}<div class="track-info"><div class="track-name">${escapeHtml(t.name)}</div><div class="track-artist">${escapeHtml(t.artists[0].name)}</div><div style="font-size:12px;color:#999">🎧 ${timeText}</div></div></div>`;
            });
            document.getElementById('recentTracksContainer').innerHTML = html || '<p>Chưa có dữ liệu</p>';
        }
        
        function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
        function logout() { localStorage.removeItem('spotify_token'); location.reload(); }
        function showLoading(show) { document.getElementById('loading').style.display = show ? 'block' : 'none'; }
    </script>
</body>
</html>
