<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Tier Maker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui;
            background: #000;
            color: #fff;
            padding: 20px;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 70% 20%, rgba(255,100,0,0.15), transparent 40%),
                        linear-gradient(135deg, #000 0%, #0a0500 100%);
            z-index: -2;
        }
        .back-home {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,.6);
            padding: 8px 16px;
            border-radius: 30px;
            color: #ffaa66;
            text-decoration: none;
            z-index: 1000;
        }
        .back-home:hover { background: #ff6600; color: #000; }
        .container { max-width: 1400px; margin: 0 auto; background: rgba(0,0,0,0.6); border-radius: 28px; padding: 30px 20px; }
        h1 { text-align: center; color: #ffb066; margin-bottom: 10px; }
        .sub { text-align: center; color: #ffaa77; margin-bottom: 30px; }
        .login-area { text-align: center; margin-bottom: 30px; }
        .btn-spotify { background: #ff6600; border: none; padding: 12px 30px; border-radius: 40px; color: #000; font-weight: bold; cursor: pointer; }
        .status { text-align: center; margin-top: 10px; color: #ffaa66; }
        .section { margin-bottom: 50px; border-bottom: 1px solid rgba(255,102,0,0.3); padding-bottom: 30px; }
        .section-title { font-size: 1.5rem; color: #ffaa66; margin-bottom: 20px; border-left: 4px solid #ff6600; padding-left: 15px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        .row { display: flex; gap: 25px; flex-wrap: wrap; margin-bottom: 25px; }
        .col-top { flex: 1; min-width: 300px; }
        .col-tier { flex: 2; min-width: 450px; }
        .card { background: rgba(0,0,0,0.5); border-radius: 20px; padding: 20px; border: 1px solid rgba(255,102,0,0.3); height: 100%; display: flex; flex-direction: column; }
        .card h3 { color: #ffaa66; margin-bottom: 15px; border-left: 3px solid #ff6600; padding-left: 12px; }
        .time-selector { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .time-btn { background: rgba(0,0,0,0.5); border: 1px solid #ff6600; padding: 5px 15px; border-radius: 30px; color: #ffaa66; cursor: pointer; }
        .time-btn.active { background: #ff6600; color: #000; }
        .list { max-height: 400px; overflow-y: auto; }
        .item { background: #111; border-radius: 12px; padding: 8px 12px; margin-bottom: 6px; display: flex; align-items: center; gap: 12px; border: 1px solid #ff6600; cursor: grab; }
        .item:active { cursor: grabbing; }
        .rank { width: 35px; color: #ffaa66; font-weight: bold; }
        .item-img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; }
        .item-info { flex: 1; }
        .item-name { font-weight: bold; }
        .item-artist { font-size: 0.7rem; color: #ffaa77; }
        .tier-badge { background: #ffaa33; color: #000; font-size: 0.65rem; padding: 2px 6px; border-radius: 12px; margin-left: 8px; display: inline-block; }
        .tier-container { max-height: 400px; overflow-y: auto; }
        .tier-row { background: rgba(0,0,0,0.5); margin-bottom: 10px; border-radius: 14px; display: flex; min-height: 85px; }
        .tier-label { width: 65px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; font-weight: bold; border-radius: 14px 0 0 14px; }
        .tier-label.S { background: #c97e00; }
        .tier-label.A { background: #8b5a2b; }
        .tier-label.B { background: #5a3a1a; }
        .tier-label.C { background: #3a2a1a; }
        .tier-label.D { background: #2a1a0a; }
        .tier-label.F { background: #1a0a05; }
        .tier-items { flex: 1; display: flex; flex-wrap: wrap; gap: 10px; padding: 10px; overflow-x: auto; }
        .tier-card { width: 80px; text-align: center; background: #1a1a1a; border-radius: 12px; padding: 5px; border: 1px solid #ff6600; cursor: grab; position: relative; }
        .tier-card:active { cursor: grabbing; }
        .tier-card-img { width: 65px; height: 65px; border-radius: 10px; object-fit: cover; }
        .tier-card-name { font-size: 0.6rem; font-weight: bold; white-space: nowrap; overflow: hidden; }
        .tier-rank-icon { position: absolute; top: 3px; right: 3px; background: #ff6600; font-size: 0.55rem; padding: 2px 5px; border-radius: 10px; }
        .drag-library { display: flex; flex-wrap: wrap; gap: 12px; max-height: 280px; overflow-y: auto; padding: 5px; }
        .drag-item { width: 85px; text-align: center; background: #111; border-radius: 12px; padding: 6px; border: 1px solid #ff6600; cursor: grab; }
        .drag-item:active { cursor: grabbing; }
        .drag-item-img { width: 70px; height: 70px; border-radius: 10px; object-fit: cover; }
        .drag-item-name { font-size: 0.65rem; font-weight: bold; white-space: nowrap; overflow: hidden; }
        .reset-btn { background: #ff6600; border: none; padding: 6px 16px; border-radius: 30px; color: #000; margin-top: 12px; cursor: pointer; }
        .refresh-btn { background: rgba(255,102,0,0.3); border: 1px solid #ff6600; padding: 5px 12px; border-radius: 30px; color: #ffaa66; cursor: pointer; font-size: 0.7rem; }
    </style>
</head>
<body>
<a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> Quay lại</a>
<div class="container">
    <h1><i class="fab fa-spotify"></i> Spotify Tier Maker</h1>
    <div class="sub">Kéo thả vào bảng S-F | Chọn mốc thời gian</div>

    <div class="login-area" id="loginArea">
        <button class="btn-spotify" id="loginBtn"><i class="fab fa-spotify"></i> Đăng nhập Spotify</button>
        <div id="loginStatus" class="status"></div>
    </div>

    <div id="mainContent" style="display: none;">
        <!-- BÀI HÁT -->
        <div class="section">
            <div class="section-title">
                <i class="fas fa-music"></i> Bài Hát
                <button id="refreshSongs" class="refresh-btn"><i class="fas fa-sync-alt"></i> Cập nhật từ Spotify</button>
            </div>
            <div class="row">
                <div class="col-top">
                    <div class="card">
                        <h3>Top 50 Bài Hát</h3>
                        <div class="time-selector" id="songTimeRange">
                            <button class="time-btn" data-range="short_term">4 tuần</button>
                            <button class="time-btn active" data-range="medium_term">6 tháng</button>
                            <button class="time-btn" data-range="long_term">Mọi thời gian</button>
                        </div>
                        <div id="topSongs" class="list"></div>
                    </div>
                </div>
                <div class="col-tier">
                    <div class="card">
                        <h3>Xếp hạng (S → F)</h3>
                        <div id="songTier" class="tier-container"></div>
                        <button id="resetSongTier" class="reset-btn"><i class="fas fa-undo-alt"></i> Đặt lại</button>
                    </div>
                </div>
            </div>
            <div class="card">
                <h3>Thư viện (kéo thả vào bảng)</h3>
                <div id="songLibrary" class="drag-library"></div>
            </div>
        </div>

        <!-- NGHỆ SĨ -->
        <div class="section">
            <div class="section-title">
                <i class="fas fa-user"></i> Nghệ Sĩ
                <button id="refreshArtists" class="refresh-btn"><i class="fas fa-sync-alt"></i> Cập nhật từ Spotify</button>
            </div>
            <div class="row">
                <div class="col-top">
                    <div class="card">
                        <h3>Top Nghệ Sĩ</h3>
                        <div class="time-selector" id="artistTimeRange">
                            <button class="time-btn" data-range="short_term">4 tuần</button>
                            <button class="time-btn active" data-range="medium_term">6 tháng</button>
                            <button class="time-btn" data-range="long_term">Mọi thời gian</button>
                        </div>
                        <div id="topArtists" class="list"></div>
                    </div>
                </div>
                <div class="col-tier">
                    <div class="card">
                        <h3>Xếp hạng (S → F)</h3>
                        <div id="artistTier" class="tier-container"></div>
                        <button id="resetArtistTier" class="reset-btn"><i class="fas fa-undo-alt"></i> Đặt lại</button>
                    </div>
                </div>
            </div>
            <div class="card">
                <h3>Thư viện (kéo thả vào bảng)</h3>
                <div id="artistLibrary" class="drag-library"></div>
            </div>
        </div>
    </div>
</div>

<script>
    const CLIENT_ID = "cd0524eb368f45ceb21721b9543bd5d6";
    const CLIENT_SECRET = "1a9856d20b41437d9c56a29d29e55f53";
    const REDIRECT_URI = window.location.origin + window.location.pathname;
    let token = null;
    
    // Khởi tạo dữ liệu - KHÔNG DÙNG MẪU
    let allSongs = JSON.parse(localStorage.getItem('allSongs')) || [];
    let songTier = JSON.parse(localStorage.getItem('songTier')) || {};
    let songPop = JSON.parse(localStorage.getItem('songPop')) || { short_term: {}, medium_term: {}, long_term: {} };
    
    let allArtists = JSON.parse(localStorage.getItem('allArtists')) || [];
    let artistTier = JSON.parse(localStorage.getItem('artistTier')) || {};
    let artistPop = JSON.parse(localStorage.getItem('artistPop')) || { short_term: {}, medium_term: {}, long_term: {} };
    
    let currentSongRange = "medium_term";
    let currentArtistRange = "medium_term";
    
    // Không tạo dữ liệu mẫu khi rỗng
    // Nếu muốn có dữ liệu mẫu để test, có thể bật lại, nhưng tạm thời tắt
    
    function saveAll() {
        localStorage.setItem('allSongs', JSON.stringify(allSongs));
        localStorage.setItem('songTier', JSON.stringify(songTier));
        localStorage.setItem('songPop', JSON.stringify(songPop));
        localStorage.setItem('allArtists', JSON.stringify(allArtists));
        localStorage.setItem('artistTier', JSON.stringify(artistTier));
        localStorage.setItem('artistPop', JSON.stringify(artistPop));
    }
    
    async function fetchSpotify(endpoint) {
        if (!token) return [];
        try {
            let res = await fetch(`https://api.spotify.com/v1/me/${endpoint}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            let data = await res.json();
            return data.items || [];
        } catch(e) { return []; }
    }
    
    async function updateSongs() {
        if (!token) { alert('Đăng nhập trước'); return; }
        const ranges = ['short_term', 'medium_term', 'long_term'];
        for (let range of ranges) {
            let items = await fetchSpotify(`top/tracks?limit=50&time_range=${range}`);
            for (let item of items) {
                if (!allSongs.find(s => s.id === item.id)) {
                    allSongs.push({
                        id: item.id,
                        name: item.name,
                        artist: item.artists[0].name,
                        image: item.album.images[0]?.url || ""
                    });
                }
                if (!songPop[range]) songPop[range] = {};
                songPop[range][item.id] = item.popularity || 0;
            }
        }
        saveAll();
        renderAll();
        document.getElementById('loginStatus').innerHTML = '✅ Đã cập nhật bài hát';
        setTimeout(() => document.getElementById('loginStatus').innerHTML = '', 2000);
    }
    
    async function updateArtists() {
        if (!token) { alert('Đăng nhập trước'); return; }
        const ranges = ['short_term', 'medium_term', 'long_term'];
        for (let range of ranges) {
            let items = await fetchSpotify(`top/artists?limit=50&time_range=${range}`);
            for (let item of items) {
                if (!allArtists.find(a => a.id === item.id)) {
                    allArtists.push({
                        id: item.id,
                        name: item.name,
                        image: item.images[0]?.url || ""
                    });
                }
                if (!artistPop[range]) artistPop[range] = {};
                artistPop[range][item.id] = item.popularity || 0;
            }
        }
        saveAll();
        renderAll();
        document.getElementById('loginStatus').innerHTML = '✅ Đã cập nhật nghệ sĩ';
        setTimeout(() => document.getElementById('loginStatus').innerHTML = '', 2000);
    }
    
    function getTopSongs(limit = 50) {
        let sorted = [...allSongs];
        let pop = songPop[currentSongRange];
        if (!pop) return [];
        sorted.sort((a, b) => (pop[b.id] || 0) - (pop[a.id] || 0));
        return sorted.slice(0, limit).map((s, i) => ({ ...s, rank: i + 1 }));
    }
    
    function getTopArtists(limit = 20) {
        let sorted = [...allArtists];
        let pop = artistPop[currentArtistRange];
        if (!pop) return [];
        sorted.sort((a, b) => (pop[b.id] || 0) - (pop[a.id] || 0));
        return sorted.slice(0, limit).map((a, i) => ({ ...a, rank: i + 1 }));
    }
    
    function renderTopSongs() {
        let container = document.getElementById('topSongs');
        if (!container) return;
        let tops = getTopSongs(50);
        if (tops.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:20px;">Chưa có dữ liệu. Hãy đăng nhập và cập nhật từ Spotify.</div>';
            return;
        }
        container.innerHTML = tops.map(s => `
            <div class="item">
                <div class="rank">#${s.rank}</div>
                <img class="item-img" src="${s.image || 'https://via.placeholder.com/40'}" onerror="this.src='https://via.placeholder.com/40'">
                <div class="item-info">
                    <div class="item-name">${escapeHtml(s.name)} ${songTier[s.id] ? `<span class="tier-badge">${songTier[s.id]}</span>` : ''}</div>
                    <div class="item-artist">${escapeHtml(s.artist)}</div>
                </div>
            </div>
        `).join('');
    }
    
    function renderTopArtists() {
        let container = document.getElementById('topArtists');
        if (!container) return;
        let tops = getTopArtists(20);
        if (tops.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:20px;">Chưa có dữ liệu. Hãy đăng nhập và cập nhật từ Spotify.</div>';
            return;
        }
        container.innerHTML = tops.map(a => `
            <div class="item">
                <div class="rank">#${a.rank}</div>
                <img class="item-img" src="${a.image || 'https://via.placeholder.com/40'}" onerror="this.src='https://via.placeholder.com/40'">
                <div class="item-info">
                    <div class="item-name">${escapeHtml(a.name)} ${artistTier[a.id] ? `<span class="tier-badge">${artistTier[a.id]}</span>` : ''}</div>
                </div>
            </div>
        `).join('');
    }
    
    function makeDraggable(el, id, type, name, artist, img) {
        el.draggable = true;
        el.ondragstart = (e) => {
            e.dataTransfer.setData('text/plain', JSON.stringify({ id, type, name, artist, image: img }));
            el.classList.add('dragging');
        };
        el.ondragend = () => el.classList.remove('dragging');
    }
    
    function renderSongTier() {
        let container = document.getElementById('songTier');
        if (!container) return;
        let tiers = ['S','A','B','C','D','F'];
        container.innerHTML = '';
        tiers.forEach(tier => {
            let row = document.createElement('div'); row.className = 'tier-row';
            let label = document.createElement('div'); label.className = `tier-label ${tier}`; label.textContent = tier;
            let itemsDiv = document.createElement('div'); itemsDiv.className = 'tier-items';
            itemsDiv.ondragover = e => e.preventDefault();
            itemsDiv.ondrop = e => {
                e.preventDefault();
                let data = JSON.parse(e.dataTransfer.getData('text/plain'));
                if (data.type === 'song') {
                    songTier[data.id] = tier;
                    saveAll();
                    renderAll();
                }
            };
            let ids = Object.entries(songTier).filter(([id,t]) => t === tier).map(([id]) => id);
            ids.forEach(id => {
                let s = allSongs.find(s => s.id === id);
                if (s) {
                    let card = document.createElement('div'); card.className = 'tier-card';
                    card.innerHTML = `<img class="tier-card-img" src="${s.image || 'https://via.placeholder.com/65'}" onerror="this.src='https://via.placeholder.com/65'"><div class="tier-card-name">${escapeHtml(s.name)}</div><div class="tier-rank-icon">${tier}</div>`;
                    makeDraggable(card, s.id, 'song', s.name, s.artist, s.image);
                    itemsDiv.appendChild(card);
                }
            });
            row.appendChild(label); row.appendChild(itemsDiv);
            container.appendChild(row);
        });
    }
    
    function renderArtistTier() {
        let container = document.getElementById('artistTier');
        if (!container) return;
        let tiers = ['S','A','B','C','D','F'];
        container.innerHTML = '';
        tiers.forEach(tier => {
            let row = document.createElement('div'); row.className = 'tier-row';
            let label = document.createElement('div'); label.className = `tier-label ${tier}`; label.textContent = tier;
            let itemsDiv = document.createElement('div'); itemsDiv.className = 'tier-items';
            itemsDiv.ondragover = e => e.preventDefault();
            itemsDiv.ondrop = e => {
                e.preventDefault();
                let data = JSON.parse(e.dataTransfer.getData('text/plain'));
                if (data.type === 'artist') {
                    artistTier[data.id] = tier;
                    saveAll();
                    renderAll();
                }
            };
            let ids = Object.entries(artistTier).filter(([id,t]) => t === tier).map(([id]) => id);
            ids.forEach(id => {
                let a = allArtists.find(a => a.id === id);
                if (a) {
                    let card = document.createElement('div'); card.className = 'tier-card';
                    card.innerHTML = `<img class="tier-card-img" src="${a.image || 'https://via.placeholder.com/65'}" onerror="this.src='https://via.placeholder.com/65'"><div class="tier-card-name">${escapeHtml(a.name)}</div><div class="tier-rank-icon">${tier}</div>`;
                    makeDraggable(card, a.id, 'artist', a.name, '', a.image);
                    itemsDiv.appendChild(card);
                }
            });
            row.appendChild(label); row.appendChild(itemsDiv);
            container.appendChild(row);
        });
    }
    
    function renderSongLibrary() {
        let container = document.getElementById('songLibrary');
        if (!container) return;
        container.innerHTML = '';
        container.ondragover = e => e.preventDefault();
        container.ondrop = e => {
            e.preventDefault();
            let data = JSON.parse(e.dataTransfer.getData('text/plain'));
            if (data.type === 'song') {
                delete songTier[data.id];
                saveAll();
                renderAll();
            }
        };
        let ranked = Object.keys(songTier);
        let unranked = allSongs.filter(s => !ranked.includes(s.id));
        unranked.forEach(s => {
            let div = document.createElement('div'); div.className = 'drag-item';
            div.innerHTML = `<img class="drag-item-img" src="${s.image || 'https://via.placeholder.com/70'}" onerror="this.src='https://via.placeholder.com/70'"><div class="drag-item-name">${escapeHtml(s.name)}</div><div class="drag-item-artist">${escapeHtml(s.artist)}</div>`;
            makeDraggable(div, s.id, 'song', s.name, s.artist, s.image);
            container.appendChild(div);
        });
    }
    
    function renderArtistLibrary() {
        let container = document.getElementById('artistLibrary');
        if (!container) return;
        container.innerHTML = '';
        container.ondragover = e => e.preventDefault();
        container.ondrop = e => {
            e.preventDefault();
            let data = JSON.parse(e.dataTransfer.getData('text/plain'));
            if (data.type === 'artist') {
                delete artistTier[data.id];
                saveAll();
                renderAll();
            }
        };
        let ranked = Object.keys(artistTier);
        let unranked = allArtists.filter(a => !ranked.includes(a.id));
        unranked.forEach(a => {
            let div = document.createElement('div'); div.className = 'drag-item';
            div.innerHTML = `<img class="drag-item-img" src="${a.image || 'https://via.placeholder.com/70'}" onerror="this.src='https://via.placeholder.com/70'"><div class="drag-item-name">${escapeHtml(a.name)}</div>`;
            makeDraggable(div, a.id, 'artist', a.name, '', a.image);
            container.appendChild(div);
        });
    }
    
    function renderAll() {
        renderTopSongs();
        renderTopArtists();
        renderSongTier();
        renderArtistTier();
        renderSongLibrary();
        renderArtistLibrary();
    }
    
    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[m] || m); }
    
    function resetSongTier() { if (confirm('Đặt lại xếp hạng bài hát?')) { songTier = {}; saveAll(); renderAll(); } }
    function resetArtistTier() { if (confirm('Đặt lại xếp hạng nghệ sĩ?')) { artistTier = {}; saveAll(); renderAll(); } }
    
    function loginSpotify() {
        let scope = 'user-read-recently-played user-top-read user-read-private';
        window.location.href = `https://accounts.spotify.com/authorize?client_id=${CLIENT_ID}&response_type=code&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=${encodeURIComponent(scope)}&show_dialog=true`;
    }
    
    async function exchangeCode(code) {
        try {
            let res = await fetch('https://accounts.spotify.com/api/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'Authorization': 'Basic ' + btoa(CLIENT_ID + ':' + CLIENT_SECRET) },
                body: new URLSearchParams({ grant_type: 'authorization_code', code, redirect_uri: REDIRECT_URI })
            });
            let data = await res.json();
            if (data.access_token) {
                token = data.access_token;
                localStorage.setItem('spotify_token', token);
                localStorage.setItem('token_expiry', Date.now() + data.expires_in * 1000);
                window.history.replaceState({}, document.title, window.location.pathname);
                await updateSongs();
                await updateArtists();
                document.getElementById('loginArea').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                renderAll();
            }
        } catch(e) { console.error(e); }
    }
    
    let urlCode = new URLSearchParams(window.location.search).get('code');
    if (urlCode) exchangeCode(urlCode);
    else {
        let saved = localStorage.getItem('spotify_token');
        let exp = localStorage.getItem('token_expiry');
        if (saved && exp && Date.now() < parseInt(exp)) {
            token = saved;
            updateSongs().then(() => updateArtists()).then(() => {
                document.getElementById('loginArea').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                renderAll();
            });
        }
    }
    
    document.getElementById('loginBtn').onclick = loginSpotify;
    document.getElementById('refreshSongs').onclick = () => updateSongs();
    document.getElementById('refreshArtists').onclick = () => updateArtists();
    document.getElementById('resetSongTier').onclick = resetSongTier;
    document.getElementById('resetArtistTier').onclick = resetArtistTier;
    
    document.querySelectorAll('#songTimeRange .time-btn').forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll('#songTimeRange .time-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentSongRange = btn.getAttribute('data-range');
            renderTopSongs();
        };
    });
    document.querySelectorAll('#artistTimeRange .time-btn').forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll('#artistTimeRange .time-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentArtistRange = btn.getAttribute('data-range');
            renderTopArtists();
        };
    });
    
    renderAll();
</script>
</body>
</html>
